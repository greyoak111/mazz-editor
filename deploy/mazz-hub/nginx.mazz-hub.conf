server {
    listen 80;
    listen [::]:80;
    server_name mazz-hub.com www.mazz-hub.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://www.mazz-hub.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.mazz-hub.com;

    ssl_certificate /etc/letsencrypt/live/www.mazz-hub.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.mazz-hub.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        client_max_body_size 4m;
    }
}

# The certificate paths above refer to server-local ACME material only; they
# must never enter the repository, logs, screenshots or publication envelopes.
