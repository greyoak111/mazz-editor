<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>工具坞</title>
<link rel="stylesheet" href="../styles/themes.css">
<link rel="stylesheet" href="panel-shared.css">
<style>
  html, body { background: transparent; margin: 0; height: 100%; overflow: hidden; } /* W58f：锁文档级滚动——滚动只发生在内层容器（外飘轨双滚动条实锤） */
  * { box-sizing: border-box; }
  body { margin:0; font:13px/1.5 var(--font-ui); }
  .pwin { display:flex; flex-direction:column; height:100vh; background:var(--bg); color:var(--fg); border-radius:12px; overflow:hidden; border:1px solid var(--border); box-shadow:0 10px 36px rgba(0,0,0,.4); }
  .p-drag { height:14px; flex:none; cursor:grab; border-radius:12px 12px 0 0; }
  .p-drag:active { cursor:grabbing; }
  .p-winbtns { position:absolute; top:2px; right:8px; display:flex; gap:2px; z-index:9; }
  .p-winbtns button { display:inline-flex; align-items:center; justify-content:center; -webkit-app-region:no-drag; width:30px; height:22px; border:0; border-radius:6px; background:transparent; color:var(--fg-dim); cursor:pointer; font-size:12px; }
  .p-winbtns button:hover { background:var(--bg-hover); color:var(--fg); }
  .p-winbtns button.x:hover { background:#e81123; color:#fff; }
  .head { display:flex; align-items:center; gap:4px; padding:8px 12px; border-bottom:1px solid var(--border); background:var(--bg-elev); flex:none; }
  .head .tab { border:0; background:none; color:var(--fg-dim); padding:4px 10px; border-radius:6px; cursor:pointer; font-size:12.5px; font-family:var(--font-ui); } /* 对齐停靠坞 .sd-tab（W54 风格同盘） */
  .head .tab.on { background:var(--accent-soft); color:var(--accent); font-weight:600; }
  .head .dock-back { margin-left:auto; border:1px solid var(--border); background:var(--bg); color:var(--fg-dim); border-radius:7px; padding:4px 10px; font-size:11.5px; cursor:pointer; font-family:var(--font-ui); }
  .head .dock-back:hover { color:var(--accent); border-color:var(--accent); }
  main { flex:1; min-width:0; min-height:0; overflow-y:auto; overflow-x:hidden; padding:12px 14px; }
  /* 打开方式页 */
  .w-drop { border:2px dashed color-mix(in srgb, var(--accent) 45%, var(--border)); border-radius:12px; padding:22px 12px; text-align:center; cursor:pointer; transition:all .15s; background:color-mix(in srgb, var(--accent) 4%, transparent); color:var(--fg-dim); }
  .w-drop.on, .w-drop:hover { border-color:var(--accent); background:color-mix(in srgb, var(--accent) 12%, transparent); transform:scale(1.015); }
  .w-drop-ico { font-size:30px; color:var(--accent); line-height:1; }
  .w-drop-t { font-size:14px; font-weight:600; color:var(--fg); margin-top:8px; }
  .w-drop-d { font-size:11.5px; color:var(--fg-dim); margin-top:3px; }
  .w-ow-grid { margin-top:10px; display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .w-ow-card { border:1px solid var(--border); background:var(--bg); color:var(--fg); border-radius:10px; padding:10px 10px 8px; cursor:pointer; text-align:left; transition:all .12s; font-family:var(--font-ui); }
  .w-ow-card:hover { border-color:var(--accent); background:color-mix(in srgb, var(--accent) 7%, var(--bg)); }
  .w-ow-card .t { font-size:12.5px; font-weight:600; }
  .w-ow-card .d { font-size:11px; color:var(--fg-dim); margin-top:2px; }
  /* 工具页 */
  .tg { margin-bottom:14px; }
  .tg-t { font-size:11px; font-weight:700; color:var(--accent); letter-spacing:1px; margin-bottom:6px; } /* 对齐停靠坞 .sd-tools-label */
  .tg-grid { display:grid; grid-template-columns:1fr 1fr; gap:7px; }
  .tg-card { display:flex; align-items:center; gap:8px; border:1px solid var(--border); background:var(--bg); border-radius:9px; padding:8px 9px; cursor:pointer; text-align:left; transition:all .12s; color:var(--fg); font-family:var(--font-ui); }
  .tg-card:hover { border-color:var(--accent); background:color-mix(in srgb, var(--accent) 6%, var(--bg)); }
  .tg-card .i { font-size:17px; flex:none; } /* 对齐 .sd-tool-ico */
  .tg-card .t { font-size:12px; font-weight:600; }
  .tg-card .d { font-size:10.5px; color:var(--fg-dim); margin-top:1px; line-height:1.35; }
  /* 智能创作页 */
  .fc-row { margin-bottom:8px; }
  .fc-row select, .fc-row input { width:100%; border:1px solid var(--border); background:var(--bg); color:var(--fg); border-radius:6px; padding:4px 8px; font-size:12px; font-family:var(--font-ui); }
  .fc-provider-hint { font-size:11.5px; color:var(--fg); margin:4px 0 8px; background:color-mix(in srgb,var(--warn) 10%,var(--bg)); box-shadow:inset 3px 0 0 var(--warn); text-indent:8px; }
  .fc-provider-hint.ok { color:var(--fg); background:color-mix(in srgb,var(--ok) 10%,var(--bg)); box-shadow:inset 3px 0 0 var(--ok); }
  .fc-field { margin-bottom:9px; }
  .fc-field label { display:block; font-size:12px; font-weight:600; margin-bottom:4px; }
  .fc-field label b { color:var(--danger); }
  .fc-field input, .fc-field textarea, .fc-field select { width:100%; border:1px solid var(--border); background:var(--bg); color:var(--fg); border-radius:7px; padding:6px 10px; font-size:12.5px; font-family:var(--font-ui); }
  .fc-field textarea { resize:vertical; }
  .fc-field input:focus, .fc-field textarea:focus { border-color:var(--accent); outline:none; }
  .fc-gdesc { font-size:11px; color:var(--fg-dim); margin:2px 0 8px; }
  .fc-label { font-size:12px; font-weight:600; margin:10px 0 5px; display:flex; align-items:center; justify-content:space-between; }
  .fc-dump-text { width:100%; border:1px solid var(--border); background:var(--bg); color:var(--fg); border-radius:8px; padding:8px 10px; font-size:12.5px; font-family:var(--font-ui); resize:vertical; }
  .fc-mini { border:1px solid var(--border); background:var(--bg); color:var(--fg-dim); border-radius:6px; padding:2px 9px; font-size:11px; cursor:pointer; font-family:var(--font-ui); }
  .fc-mini:hover { color:var(--accent); border-color:var(--accent); }
  .fc-actions { display:flex; flex-wrap:wrap; gap:7px; margin-top:12px; }
  .fc-btn { flex:1; border:1px solid var(--border); background:var(--bg-elev); color:var(--fg); border-radius:8px; padding:8px 10px; font-size:12.5px; cursor:pointer; font-family:var(--font-ui); }
  .fc-btn:hover { border-color:var(--accent); }
  .fc-btn.fc-accent { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); }
  .fc-check { display:flex; align-items:center; gap:5px; font-size:11.5px; color:var(--fg-dim); margin-top:8px; }
  .fc-tasks { margin-top:12px; }
  .fc-task { border:1px solid var(--border); border-radius:9px; padding:8px 10px; margin-bottom:7px; background:var(--bg-elev); }
  .fc-task .tt { font-size:12px; font-weight:600; display:flex; justify-content:space-between; }
  .fc-task .ts { font-size:11px; color:var(--fg-dim); margin-top:3px; }
  .fc-task .bar { height:4px; background:var(--bg-active); border-radius:2px; margin-top:6px; overflow:hidden; }
  .fc-task .bar i { display:block; height:100%; background:var(--accent); border-radius:2px; }
  .extras { margin-top:8px; border-top:1px dashed var(--border); padding-top:8px; }
  .extras summary { font-size:12px; color:var(--fg-dim); cursor:pointer; }
  .chip { display:inline-block; border:1px solid var(--border); border-radius:99px; padding:2px 10px; font-size:11px; margin:2px 3px 2px 0; cursor:pointer; }
  .chip.on { background:var(--accent-soft); color:var(--accent); border-color:var(--accent); }
  .note { font-size:11px; color:var(--fg-dim); margin-top:6px; line-height:1.6; }
  .fc-actions > .note { flex:1 0 100%; margin-top:0; text-align:right; }
  /* W87i：浮动坞追平停靠坞指令台。窗只是远程视图，执行 owner 仍在主窗 FactoryPanel。 */
  .df-command { min-width:0; margin-top:12px; border:1px solid color-mix(in srgb,var(--accent) 32%,var(--border)); border-radius:10px; padding:9px; background:color-mix(in srgb,var(--accent) 4%,var(--bg-elev)); display:flex; flex-direction:column; gap:7px; }
  .df-command-head { min-width:0; display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
  .df-command-head > span:first-child { min-width:0; display:flex; flex-direction:column; }
  .df-command-head b { font-size:12.5px; }
  .df-command-status { color:var(--fg-dim); font-size:10.5px; overflow-wrap:anywhere; }
  .df-permission { flex:none; color:var(--fg-dim); font-size:10px; }
  .df-harness { min-width:0; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,.8fr) auto; gap:6px; align-items:end; }
  .df-harness label { min-width:0; display:flex; flex-direction:column; gap:2px; color:var(--fg-dim); font-size:9.5px; }
  .df-harness select, .df-harness input { min-width:0; width:100%; height:28px; border:1px solid var(--border); border-radius:6px; padding:3px 6px; background:var(--bg); color:var(--fg); font:11px var(--font-ui); }
  .df-health { grid-column:1 / -1; min-width:0; color:var(--fg-dim); font-size:9.5px; overflow-wrap:anywhere; }
  .df-feed { max-height:180px; overflow:auto; display:flex; flex-direction:column; gap:5px; }
  .df-card { min-width:0; border:1px solid var(--border); border-left:3px solid var(--fg-dim); border-radius:7px; padding:6px 7px; background:var(--bg); }
  .df-card.user { border-left-color:var(--accent); }
  .df-card.result, .df-card.finish { border-left-color:var(--ok); }
  .df-card.error, .df-card.confirm { border-left-color:var(--danger); }
  .df-card.clarify { border-left-color:var(--warn); }
  .df-card b { display:block; font-size:11px; }
  .df-card p { margin:2px 0 0; color:var(--fg-dim); font-size:10.5px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .df-chips { display:flex; flex-wrap:wrap; gap:4px; }
  .df-chip { max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; border:1px solid var(--border); border-radius:999px; padding:2px 7px; background:var(--bg); color:var(--fg-dim); font:10px var(--font-ui); cursor:pointer; }
  .df-inputrow { min-width:0; display:flex; align-items:stretch; gap:6px; }
  .df-inputrow textarea { flex:1; min-width:0; resize:vertical; border:1px solid var(--border); border-radius:7px; padding:6px 7px; background:var(--bg); color:var(--fg); font:11.5px/1.5 var(--font-ui); }
  .df-inputrow .fc-btn { flex:none; width:56px; padding:5px; }
  .df-foot { min-width:0; display:flex; flex-wrap:wrap; justify-content:space-between; gap:3px 8px; color:var(--fg-dim); font-size:9.5px; }
  @media (max-width:430px) {
    .head { padding-left:8px; padding-right:8px; }
    .head .tab { padding-left:7px; padding-right:7px; }
    .head .dock-back { padding-left:7px; padding-right:7px; }
    main { padding:10px; }
    .tg-grid, .w-ow-grid { grid-template-columns:1fr; }
    .df-harness { grid-template-columns:minmax(0,1fr) minmax(0,1fr); }
    .df-harness .fc-mini { width:100%; }
  }
</style></head><body><script type="module" src="panel-runtime.js"></script>
<div class="pwin">
  <div class="p-drag"></div>
  <div class="p-winbtns"><button id="p-min" title="最小化"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg></button><button id="p-max" title="最大化/还原"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="1.5"/></svg></button><button class="x" id="p-close" title="关闭"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="head">
    <button class="tab on" data-t="factory">智能创作</button>
    <button class="tab" data-t="openwith">打开方式</button>
    <button class="tab" data-t="tools">工具</button>
    <button class="dock-back" id="dock-back" title="坞回主窗停靠"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M9 5h10v14H9zM4 12h9M10 8l4 4-4 4"/></svg> 回停靠</button>
  </div>
  <main id="m" class="ps-scroll-y"></main>
</div>
<script type="module">
import { iconHtml } from '../lib/svg-icons.js';
const $ = (s) => document.querySelector(s);
// W54 手势三态②：自绘拖拽（跨屏自由——app-region:drag 的 transparent 跨屏病绕开）；
// setPointerCapture 兜底页外跟手，e.screenX/Y 供屏坐标，主进程 setBounds
{
  const dz = document.querySelector('.p-drag');
  dz.addEventListener('pointerdown', (e) => {
    if (e.target.closest('button')) return;
    e.preventDefault();
    try { dz.setPointerCapture(e.pointerId); } catch {}
    window.mazz.invoke('panel:dragStart', { kind: 'dockfloat', origin: 'float', sx: e.screenX, sy: e.screenY }).catch(() => {});
    const move = (ev) => window.mazz.invoke('panel:move', { kind: 'dockfloat', origin: 'float', sx: ev.screenX, sy: ev.screenY }).catch(() => {});
    let settled = false;
    const cleanup = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', cancel);
      window.removeEventListener('blur', cancel);
      try { if (dz.hasPointerCapture(e.pointerId)) dz.releasePointerCapture(e.pointerId); } catch {}
    };
    const finish = (cancelled) => {
      if (settled) return;
      settled = true;
      cleanup();
      window.mazz.invoke(cancelled ? 'panel:dragCancel' : 'panel:dragEnd', { kind: 'dockfloat', origin: 'float' }).catch(() => {}); // 拽回热区=自动停靠（三态之拽回）
    };
    const up = () => finish(false);
    const cancel = () => finish(true);
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', cancel);
    window.addEventListener('blur', cancel);
  });
}
const pwb = (a) => window.mazz.invoke('window:' + a).catch(() => {});
$('#p-min').addEventListener('click', () => pwb('minimize'));
$('#p-max').addEventListener('click', () => pwb('toggleMaximize'));
$('#p-close').addEventListener('click', () => pwb('close'));
const applyTheme = (id, vars) => { if (id) document.documentElement.dataset.theme = id; if (vars) for (const [k, v] of Object.entries(vars)) if (v) document.documentElement.style.setProperty('--' + k, v); };
window.mazz.invoke('panel:action', { type: 'themeSnapshot' }).catch(() => {});
window.mazz.on('theme:changed', ({ id, vars }) => applyTheme(id, vars));
window.mazz.on('panel:push', (p) => { if (p?.type === 'themeInit') applyTheme(p.id, p.vars); });
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');

let tab = 'factory', snapshot = null, toolsData = null, localValues = {};
let toolsRequestTimer = 0, toolsRequestAttempt = 0;
const commandLocal = { initialized: false, draft: '', adapter: '', model: '' };
function act(type, extra = {}) { window.mazz.invoke('panel:action', { type, ...extra }).catch(() => {}); }

function requestToolsSnapshot({ reset = false } = {}) {
  if (toolsData?.some?.(([, items]) => items?.length)) return;
  if (reset) toolsRequestAttempt = 0;
  clearTimeout(toolsRequestTimer);
  act('dockToolsQuery', { attempt: toolsRequestAttempt });
  // 冷启动时 SideDock 的动态 import 可能尚未建立 GROUPS。空数组只是“未就绪”，
  // 不是终态；本页做有界重试，owner 构建完成后还会主动 push 一次最终清单。
  if (toolsRequestAttempt < 20) {
    toolsRequestAttempt += 1;
    toolsRequestTimer = setTimeout(() => requestToolsSnapshot(), 250);
  }
}

// —— 回停靠：关子窗+坞回 workspace（主窗 panel:changed 联动） ——
$('#dock-back').addEventListener('click', () => { act('dockFloatBack'); pwb('close'); });

function setTab(t) {
  tab = t;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  render();
  if (t === 'tools' && !toolsData) requestToolsSnapshot({ reset: true });
}
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => setTab(b.dataset.t)));

// ==================== 打开方式页 ====================
function renderOpenWith() {
  $('#m').innerHTML = `
    <div class="w-drop" id="dz"><div class="w-drop-ico"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M12 5v12M6 13l6 6 6-6M5 5h14"/></svg></div><div class="w-drop-t">把文件拖到这里</div><div class="w-drop-d">图片 · PDF · 音视频，立即查看</div></div>
    <div class="w-ow-grid">
      <button class="w-ow-card" data-cmd="file.openViewer"><div class="t"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><rect x="3" y="5" width="18" height="14" rx="1"/><circle cx="9" cy="10" r="1.5"/><path d="M4 17l5-4 4 3 3-2 4 3"/></svg> 查看器预览</div><div class="d">图片/PDF/音视频</div></button>
      <button class="w-ow-card" data-cmd="file.openWithSystem"><div class="t"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M12 2c4 2 6 6 6 10l-3 5H9l-3-5c0-4 2-8 6-10zM9 17c-2 1-3 3-3 5 2 0 4-1 5-3h2c1 2 3 3 5 3 0-2-1-4-3-5"/></svg> 系统默认打开</div><div class="d">调起外部程序</div></button>
      <button class="w-ow-card" data-cmd="file.import"><div class="t"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M12 4v11M7 10l5 5 5-5M4 15v5h16v-5"/></svg> 导入工作区</div><div class="d">多选文件/文件夹</div></button>
      <button class="w-ow-card" data-cmd="file.quickOpen"><div class="t"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z"/></svg> 快速跳转</div><div class="d">最近文件直达</div></button>
    </div>`;
  document.querySelectorAll('[data-cmd]').forEach(b => b.addEventListener('click', () => act('dockRun', { cmd: b.dataset.cmd })));
  const dz = document.getElementById('dz');
  dz.addEventListener('dragover', (e) => { e.preventDefault(); e.stopPropagation(); dz.classList.add('on'); e.dataTransfer.dropEffect = 'copy'; });
  dz.addEventListener('dragleave', () => dz.classList.remove('on'));
  dz.addEventListener('drop', (e) => {
    e.preventDefault(); e.stopPropagation(); dz.classList.remove('on');
    const paths = [...(e.dataTransfer?.files || [])].map(f => f.path).filter(Boolean);
    for (const p of paths) act('dockOpenPath', { path: p });
  });
  dz.addEventListener('click', () => act('dockRun', { cmd: 'file.openViewer' }));
}

// ==================== 工具页 ====================
function renderTools() {
  if (!toolsData?.some?.(([, items]) => items?.length)) { $('#m').innerHTML = '<div class="note">加载工具清单…</div>'; return; }
  $('#m').innerHTML = toolsData.map(([g, items]) => `
    <div class="tg"><div class="tg-t">${esc(g)}</div><div class="tg-grid">
      ${items.map(it => { const ico = String(it.ico || '').trim(); return `<button class="tg-card" data-cmd="${esc(it.cmd)}"><span class="i">${ico.startsWith('<svg') ? ico : iconHtml(ico)}</span><span><span class="t">${esc(it.t)}</span><div class="d">${esc(it.d)}</div></span></button>`; }).join('')}
    </div></div>`).join('');
  document.querySelectorAll('.tg-card').forEach(b => b.addEventListener('click', () => act('dockRun', { cmd: b.dataset.cmd })));
}

// ==================== 智能创作页（状态镜像：主窗 factoryPanel 是真相源） ====================
function fieldHtml(f) {
  const req = f.required ? '<b>*</b>' : '';
  const val = esc(localValues[f.id] ?? f.default ?? '');
  if (f.type === 'textarea') return `<div class="fc-field"><label>${esc(f.label)}${req}</label><textarea data-f="${esc(f.id)}" rows="3" placeholder="${esc(f.placeholder || '')}">${val}</textarea></div>`;
  if (f.type === 'select') return `<div class="fc-field"><label>${esc(f.label)}${req}</label><select data-f="${esc(f.id)}">${(f.options || []).map(o => `<option value="${esc(o)}" ${o === (localValues[f.id] ?? f.default) ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select></div>`;
  return `<div class="fc-field"><label>${esc(f.label)}${req}</label><input data-f="${esc(f.id)}" value="${val}" placeholder="${esc(f.placeholder || '')}"></div>`;
}
function captureCommandLocal() {
  const draft = $('#df-agent-input');
  const model = $('#df-model');
  const adapter = $('#df-adapter');
  if (draft) commandLocal.draft = draft.value;
  if (model) commandLocal.model = model.value;
  if (adapter) commandLocal.adapter = adapter.value;
  const active = document.activeElement;
  const id = active?.id || '';
  return {
    id,
    start: typeof active?.selectionStart === 'number' ? active.selectionStart : null,
    end: typeof active?.selectionEnd === 'number' ? active.selectionEnd : null,
    direction: active?.selectionDirection || 'none',
    scrollTop: $('#m')?.scrollTop || 0,
  };
}
function restoreCommandLocal(view) {
  const draft = $('#df-agent-input');
  const model = $('#df-model');
  const adapter = $('#df-adapter');
  if (draft) draft.value = commandLocal.draft;
  if (model) model.value = commandLocal.model;
  if (adapter && [...adapter.options].some(option => option.value === commandLocal.adapter && !option.disabled)) adapter.value = commandLocal.adapter;
  const main = $('#m');
  if (main) main.scrollTop = view?.scrollTop || 0;
  const active = view?.id ? document.getElementById(view.id) : null;
  if (!active) return;
  active.focus({ preventScroll: true });
  if (view.start != null && typeof active.setSelectionRange === 'function') {
    try { active.setSelectionRange(view.start, view.end, view.direction); } catch {}
  }
}
function renderFactory() {
  if (!snapshot) { $('#m').innerHTML = '<div class="note">同步创作面板状态…</div>'; return; }
  const localView = captureCommandLocal();
  const s = snapshot;
  const d = s.commandDesk || {};
  if (!commandLocal.initialized) {
    commandLocal.initialized = true;
    commandLocal.adapter = d.adapter || 'internal';
    commandLocal.model = d.model || '';
  }
  $('#m').innerHTML = `
    <div class="fc-provider-hint ${s.providerConfigured ? 'ok' : ''}">${esc(s.providerHint || '')}</div>
    <div class="fc-task" style="margin-top:8px"><div class="tt"><span>智能创作执行台</span><button class="fc-mini" id="fc-project">${iconHtml('＋')} 新建立项</button></div><div class="ts">立项表单只在独立向导出现；这里保留任务、进度与日常执行。</div></div>
    <div class="fc-actions"><button class="fc-btn fc-accent" id="fc-runall">${iconHtml('▶▶')} 全部启动</button><button class="fc-btn" id="fc-autopreview">${iconHtml(s.autoPreview !== false ? '●' : '○')} 自动预览</button><span class="note">并发 ${s.runningCount || 0}/${s.concurrency || 1}</span></div>
    <div class="fc-tasks" id="fc-tasks">${renderTasksHtml(s.tasks)}</div>
    <section class="df-command" aria-label="指令台">
      <div class="df-command-head"><span><b>指令台</b><span class="df-command-status">${esc(d.status || '命令闭集待命')}</span></span><span class="df-permission">${esc(d.permission || '受限权限')}</span></div>
      <div class="df-harness">
        <label>执行器<select id="df-adapter">${(d.adapters?.length ? d.adapters : [{ id: 'internal', label: '内置指令台' }]).map(row => `<option value="${esc(row.id)}" ${row.id === commandLocal.adapter ? 'selected' : ''} ${row.disabled ? 'disabled' : ''}>${esc(row.label)}</option>`).join('')}</select></label>
        <label>模型<input id="df-model" value="${esc(commandLocal.model)}" placeholder="默认模型" spellcheck="false"></label>
        <button class="fc-mini" id="df-health" type="button">检测</button>
        <span class="df-health">${esc(d.health || '等待检测')}</span>
      </div>
      ${d.chips?.length ? `<div class="df-chips">${d.chips.map(value => `<button class="df-chip" type="button" data-command="${esc(value)}" title="回填常用指令">${esc(value)}</button>`).join('')}</div>` : ''}
      ${d.cards?.length ? `<div class="df-feed">${d.cards.map(card => `<div class="df-card ${/^(user|tool|result|finish|clarify|confirm|error)$/.test(card.kind) ? card.kind : 'result'}"><b>${esc(card.title)}</b><p>${esc(card.body)}</p></div>`).join('')}</div>` : ''}
      <div class="df-inputrow"><textarea id="df-agent-input" rows="2" placeholder="下达一项指令；Ctrl+Enter 执行。" spellcheck="false"></textarea><button class="fc-btn fc-accent" id="df-agent-submit" ${d.busy ? 'disabled' : ''}>执行</button></div>
      <div class="df-foot"><span>${esc(d.toolCount || '')}</span><span>${esc(d.ledgerHint || '')}</span></div>
    </section>`;
  $('#fc-project')?.addEventListener('click', () => act('factoryAction', { act: 'project' }));
  $('#fc-runall')?.addEventListener('click', () => act('factoryAction', { act: 'runall' }));
  $('#fc-autopreview')?.addEventListener('click', () => act('factoryAction', { act: 'setAutoPreview', value: s.autoPreview === false }));
  $('#df-health')?.addEventListener('click', () => act('factoryAction', { act: 'harnessRefresh' }));
  document.querySelectorAll('.df-chip').forEach(button => button.addEventListener('click', () => {
    const input = $('#df-agent-input');
    if (input) { input.value = button.dataset.command || ''; input.focus(); }
  }));
  const submitAgent = () => {
    const input = $('#df-agent-input');
    const value = input?.value.trim() || '';
    if (!value) { input?.focus(); return; }
    const button = $('#df-agent-submit');
    if (button) button.disabled = true;
    act('factoryAction', { act: 'agentSubmit', input: value, adapter: $('#df-adapter')?.value || 'internal', model: $('#df-model')?.value.trim() || '' });
  };
  $('#df-agent-submit')?.addEventListener('click', submitAgent);
  $('#df-agent-input')?.addEventListener('keydown', event => { if (event.key === 'Enter' && (event.ctrlKey || event.metaKey)) { event.preventDefault(); submitAgent(); } });
  $('#df-agent-input')?.addEventListener('input', event => { commandLocal.draft = event.currentTarget.value; });
  $('#df-adapter')?.addEventListener('change', event => { commandLocal.adapter = event.currentTarget.value; });
  $('#df-model')?.addEventListener('input', event => { commandLocal.model = event.currentTarget.value; });
  restoreCommandLocal(localView);
}
function renderTasksHtml(tasks) {
  if (!tasks?.length) return '';
  return '<div class="fc-label">任务</div>' + tasks.map(t => `
    <div class="fc-task"><div class="tt"><span>${esc(t.title)}</span><span>${esc(t.statusText || '')}</span></div>
    <div class="ts">${esc(t.desc || '')}</div>
    ${t.pct != null ? `<div class="bar"><i style="width:${Math.round(t.pct)}%"></i></div>` : ''}</div>`).join('');
}

function render() {
  if (tab === 'openwith') renderOpenWith();
  else if (tab === 'tools') renderTools();
  else renderFactory();
}

window.mazz.on('panel:push', (p) => {
  if (p?.type === 'factorySnapshot') {
    const genreChanged = snapshot && snapshot.genreId !== p.snapshot.genreId;
    snapshot = p.snapshot;
    if (!genreChanged) localValues = { ...(snapshot.values || {}), ...localValues };
    else localValues = { ...(snapshot.values || {}) };
    if (tab === 'factory') renderFactory();
    return;
  }
  if (p?.type === 'factoryTasks') {
    if (snapshot) snapshot.tasks = p.tasks;
    const el = document.getElementById('fc-tasks');
    if (el) el.innerHTML = renderTasksHtml(p.tasks);
    return;
  }
  if (p?.type === 'dockTools') {
    if (p.groups?.some?.(([, items]) => items?.length)) {
      toolsData = p.groups;
      clearTimeout(toolsRequestTimer);
      toolsRequestTimer = 0;
      if (tab === 'tools') renderTools();
    } else {
      toolsData = null;
      requestToolsSnapshot();
    }
    return;
  }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') pwb('close'); });
act('dockFloatInit'); // 面板就绪信号：主窗推首发 Factory 快照
requestToolsSnapshot({ reset: true }); // 与快照并行预取；冷启动空响应会重试，owner ready 后再主动推送
</script>
</body></html>
