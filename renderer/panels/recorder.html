<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>全局内录（预览）</title>
<link rel="stylesheet" href="../styles/themes.css">
<link rel="stylesheet" href="panel-shared.css">
<style>
  html, body { background: transparent; margin: 0; height: 100%; overflow: hidden; } /* W58f：锁文档级滚动——滚动只发生在内层容器（外飘轨双滚动条实锤） */
  * { box-sizing: border-box; }
  body { margin:0; font:13px/1.5 var(--font-ui); }
  .pwin { display:flex; flex-direction:column; height:100vh; background:var(--bg); color:var(--fg); border-radius:12px; overflow:hidden; border:1px solid var(--border); box-shadow:0 10px 36px rgba(0,0,0,.4); }
  .p-drag { height:12px; flex:none; -webkit-app-region:drag; }
  .p-winbtns { position:absolute; top:2px; right:8px; display:flex; gap:2px; z-index:9; }
  .p-winbtns button { display:inline-flex; align-items:center; justify-content:center; -webkit-app-region:no-drag; width:30px; height:22px; border:0; border-radius:6px; background:transparent; color:var(--fg-dim); cursor:pointer; font-size:12px; }
  .p-winbtns button:hover { background:var(--bg-hover); color:var(--fg); }
  .p-winbtns button.x:hover { background:#e81123; color:#fff; }
  .head { display:flex; align-items:center; gap:8px; padding:10px 16px; border-bottom:1px solid var(--border); background:var(--bg-elev); flex:none; }
  .head .t { font-size:15px; font-weight:600; flex:1; }
  main { flex:1; min-height:0; padding:12px 16px; overflow-y:auto; display:flex; flex-direction:column; gap:10px; }
  .rec-srcs { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; max-height:250px; overflow-y:auto; }
  .rec-src { border:2px solid var(--border); border-radius:8px; padding:5px; cursor:pointer; text-align:center; }
  .rec-src:hover { border-color:var(--fg-dim); }
  .rec-src.on { border-color:var(--accent); }
  .rec-src img { width:100%; border-radius:5px; display:block; }
  .rec-src .nm { font-size:11.5px; margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rec-src .noimg { height:76px; display:grid; place-items:center; color:var(--fg-dim); font-size:11px; }
  .opts { display:flex; gap:12px; align-items:center; flex-wrap:wrap; font-size:12.5px; }
  .opts label { display:flex; align-items:center; gap:5px; }
  .sel { border:1px solid var(--border); background:var(--bg); color:var(--fg); border-radius:6px; padding:3px 8px; font-size:12px; font-family:var(--font-ui); }
  .btn { border:1px solid var(--border); background:var(--bg); color:var(--fg); border-radius:6px; padding:6px 8px; font-size:12px; cursor:pointer; font-family:var(--font-ui); }
  .btn:hover { border-color:var(--accent); color:var(--accent); }
  .btn.pri { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); }
  .btn.stop { background:#c2410c; color:#fff; border-color:#c2410c; }
  .hint { font-size:11.5px; color:var(--fg-dim); }
  .status { display:none; flex-direction:column; align-items:center; gap:12px; padding:36px 0; }
  .status.on { display:flex; }
  .status .dot { width:14px; height:14px; border-radius:50%; background:#c2410c; animation:blink 1.2s infinite; }
  @keyframes blink { 50% { opacity:.25; } }
  .status .tm { font-size:26px; font-family:var(--font-mono); }
  .form.hide { display:none; }
</style></head><body><script type="module" src="panel-runtime.js"></script>
<div class="pwin">
  <div class="p-drag"></div>
  <div class="p-winbtns"><button id="p-min" title="最小化"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg></button><button id="p-max" title="最大化/还原"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="1.5"/></svg></button><button class="x" id="p-close" title="关闭"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="head"><span class="t">全局内录（预览）</span><span class="hint" id="st-text"></span></div>
  <main class="ps-scroll-y">
    <div class="form" id="form">
      <div class="hint">选择录制源（可多选平铺合成）：</div>
      <div class="rec-srcs ps-scroll-y" id="srcs"></div>
      <div class="opts">
        <label><input type="checkbox" id="rec-sys" checked> 系统内音</label>
        <label><input type="checkbox" id="rec-mic"> 麦克风</label>
        <label><input type="checkbox" id="rec-sub" checked> 字幕轨（语音识别存 .srt）</label>
        <label>变速 <select id="rec-speed" class="sel"><option value="1">原速</option><option value="3" selected>3 倍速</option><option value="10">10 倍速</option><option value="6">6 倍速</option></select></label>
        <label>格式 <select id="rec-fmt" class="sel"><option value="webm">webm（即存即播）</option></select></label>
      </div>
      <div style="display:flex;justify-content:flex-end">
        <button class="btn pri" id="rec-go"><svg class="mz-ico" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="7" fill="currentColor"/></svg><span>开始录制</span></button>
      </div>
      <div class="hint">默认保存到工作区「录制/」。封板版只提供 webm；mp4 转码将在可验证源码分发闭环后重新启用。录制本体在主窗执行——本面板可关闭，录制不中断。</div>
      <div class="hint">Preview 安全边界：权限等待 60 秒超时；单次最多 2 小时或 1 GiB 内存缓冲，先到即停止并保存。麦克风/系统音、全屏、RDP 与虚拟显示兼容性取决于本机设备和 Windows 策略。</div>
    </div>
    <div class="status" id="status">
      <div class="dot"></div>
      <img id="live" alt="" style="width:100%;max-width:340px;border-radius:10px;border:1px solid var(--border);display:none">
      <div class="tm" id="tm">00:00</div>
      <div class="hint" id="st-srcs"></div>
      <button class="btn stop" id="rec-stop"><svg class="mz-ico" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1" fill="currentColor"/></svg><span>停止录制</span></button>
    </div>
  </main>
</div>
<script>
const $ = (s) => document.querySelector(s);
const pwb = (a) => window.mazz.invoke('window:' + a).catch(() => {});
$('#p-min').addEventListener('click', () => pwb('minimize'));
$('#p-max').addEventListener('click', () => pwb('toggleMaximize'));
$('#p-close').addEventListener('click', () => pwb('close'));
const applyTheme = (id, vars) => { if (id) document.documentElement.dataset.theme = id; if (vars) for (const [k, v] of Object.entries(vars)) if (v) document.documentElement.style.setProperty('--' + k, v); };
window.mazz.invoke('panel:action', { type: 'themeSnapshot' }).catch(() => {});
window.mazz.on('theme:changed', ({ id, vars }) => applyTheme(id, vars));
window.mazz.on('panel:push', (p) => { if (p?.type === 'themeInit') applyTheme(p.id, p.vars); });
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');

let sources = [], picked = new Set(), recording = false, startedAt = 0, timer = null;

async function boot() {
  const r = await window.mazz.invoke('panel:action', { type: 'recQuery' }).catch(() => null);
  // recQuery 是问答桥——状态经 panel:push 回；直取 sources 走白名单直调
  await refreshSrcs();
}
async function refreshSrcs() {
  try { sources = await window.mazz.invoke('rec:sources') || []; } catch { sources = []; }
  render();
}
// W54 B9：选源卡实时预览——desktopCapturer 每次调用重新截屏，2.5s 定时刷新即轻量实况；
// 录制中停刷（状态卡上场）+ 选中态跨刷新保持（按 id 回挂）
setInterval(() => { if (!recording && !document.hidden) refreshSrcs(); }, 2500);
function render() {
  if (!sources.length) { $('#srcs').innerHTML = '<div class="hint">没有可用的录制源（检查系统录屏权限后重试）</div>'; return; }
  if (!picked.size && sources[0]) picked.add(sources[0].id);
  $('#srcs').innerHTML = sources.map(s => `
    <div class="rec-src ${picked.has(s.id) ? 'on' : ''}" data-id="${esc(s.id)}">
      ${s.thumb ? `<img src="${s.thumb}">` : '<div class="noimg">无预览</div>'}
      <div class="nm">${esc(s.name)}</div>
    </div>`).join('');
  document.querySelectorAll('.rec-src').forEach(el => el.addEventListener('click', () => {
    const id = el.dataset.id;
    if (picked.has(id)) picked.delete(id); else picked.add(id);
    el.classList.toggle('on', picked.has(id));
  }));
}
function setMode(on) {
  recording = on;
  $('#form').classList.toggle('hide', on);
  $('#status').classList.toggle('on', on);
  clearInterval(timer);
  if (on) {
    timer = setInterval(() => {
      const sec = Math.floor((Date.now() - startedAt) / 1000);
      $('#tm').textContent = String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0');
    }, 500);
  }
}
$('#rec-go').addEventListener('click', () => {
  if (!picked.size) { $('#st-text').textContent = '先选择录制源'; return; }
  const chosen = sources.filter(s => picked.has(s.id));
  $('#st-text').textContent = '启动中…';
  window.mazz.invoke('panel:action', { type: 'recStart', payload: {
    sources: chosen,
    speed: +$('#rec-speed').value,
    sysAudio: $('#rec-sys').checked,
    micAudio: $('#rec-mic').checked,
    outFormat: $('#rec-fmt').value,
    subtitle: $('#rec-sub').checked,
    name: '全局内录',
  } }).catch(() => {});
});
$('#rec-stop').addEventListener('click', () => {
  $('#st-text').textContent = '正在停止并收尾…';
  window.mazz.invoke('panel:action', { type: 'recStop' }).catch(() => {});
});
window.mazz.on('panel:push', (p) => {
  // W56 B11：实况帧上屏（合成画布 2fps 推送——录制中画面预览平反）
  if (p?.type === 'recFrame' && p.data) {
    const img = document.getElementById('live');
    if (img) { img.style.display = 'block'; img.src = p.data; }
    return;
  }
  if (p?.type !== 'recState') return;
  if (p.recording) { startedAt = p.startedAt || Date.now(); $('#st-srcs').textContent = p.desc || ''; $('#st-text').textContent = '录制中'; setMode(true); }
  else { setMode(false); $('#st-text').textContent = p.msg || ''; const img = document.getElementById('live'); if (img) img.style.display = 'none'; }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') pwb('close'); });
boot();
</script>
</body></html>
