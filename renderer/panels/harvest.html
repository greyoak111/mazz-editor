<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>AI 对话整理</title>
<link rel="stylesheet" href="../styles/themes.css">
<link rel="stylesheet" href="panel-shared.css">
<style>
  html, body { background:transparent; margin:0; height:100%; overflow: hidden }*{box-sizing:border-box}
  body{font:13px/1.55 var(--font-ui)}button{font:inherit}
  .pwin{display:flex;flex-direction:column;height:100vh;background:var(--bg);color:var(--fg);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:0 10px 36px rgba(0,0,0,.4)}
  .p-drag{height:12px;flex:none;-webkit-app-region:drag}.p-winbtns{position:absolute;top:2px;right:8px;display:flex;gap:2px;z-index:9}
  .p-winbtns button{display:inline-flex;align-items:center;justify-content:center;-webkit-app-region:no-drag;width:30px;height:22px;border:0;border-radius:6px;background:transparent;color:var(--fg-dim);cursor:pointer}
  .p-winbtns button:hover{background:var(--bg-hover);color:var(--fg)}.p-winbtns .x:hover{background:#e81123;color:#fff}
  header{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--bg-elev);flex:none}
  header b{font-size:15px}.head-meta{color:var(--fg-dim);font-size:11.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .controls{display:flex;align-items:center;flex-wrap:wrap;gap:7px;padding:9px 16px;border-bottom:1px solid var(--border);background:var(--bg)}
  button{border:1px solid var(--border);background:var(--bg-elev);color:var(--fg);border-radius:7px;padding:4px 9px;cursor:pointer}
  button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}button.on,button.pri{background:var(--accent);color:var(--accent-fg,#fff);border-color:var(--accent)}
  button:disabled{opacity:.58;cursor:default}.split{width:1px;height:20px;background:var(--border);margin:0 2px}.count{margin-left:auto;color:var(--fg-dim);font-size:12px}
  main{flex:1;min-height:0;overflow:auto;padding:11px 16px}.empty{padding:46px 18px;text-align:center;color:var(--fg-dim)}
  .msg{display:grid;grid-template-columns:24px 76px minmax(0,1fr);gap:9px;align-items:start;padding:10px 8px;border-bottom:1px solid var(--border)}
  .msg:hover{background:var(--bg-hover)}.msg input{margin-top:6px}.role{border-radius:999px;padding:3px 7px;font-size:11.5px;white-space:nowrap}
  .role.user{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 55%,var(--border));color:var(--fg);background:color-mix(in srgb,var(--accent) 10%,var(--bg))}.role.assistant{box-shadow:inset 0 0 0 1px var(--ok);color:var(--fg);background:color-mix(in srgb,var(--ok) 10%,var(--bg))}
  .text{white-space:pre-wrap;word-break:break-word;max-height:150px;overflow:auto;font-size:12.5px}.uncertain{opacity:.72}
  footer{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:10px 16px;border-top:1px solid var(--border);background:var(--bg-elev);flex:none}
  #status{flex:1 0 100%;min-width:0;color:var(--fg-dim);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .candidate-review{flex:none;max-height:42vh;overflow:auto;padding:12px 16px;border-top:1px solid var(--border);background:color-mix(in srgb,var(--bg-elev) 82%,var(--bg))}
  .candidate-review[hidden]{display:none}.candidate-head{display:flex;align-items:center;gap:8px;margin-bottom:9px}.candidate-head b{font-size:13px}.candidate-head span{color:var(--fg-dim);font-size:11.5px}
  .candidate-grid{display:grid;grid-template-columns:112px minmax(0,1fr);gap:8px 10px;align-items:center}.candidate-grid label{color:var(--fg-dim);font-size:12px}
  .candidate-grid input,.candidate-grid select,.candidate-grid textarea{width:100%;border:1px solid var(--border);border-radius:7px;background:var(--bg);color:var(--fg);font:inherit;padding:6px 8px;outline:none}
  .candidate-grid input:focus,.candidate-grid select:focus,.candidate-grid textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 20%,transparent)}
  .candidate-grid textarea{min-height:92px;max-height:220px;resize:vertical;line-height:1.55}.candidate-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
  #candidate-reject{color:var(--danger)}#candidate-reject:hover:not(:disabled){border-color:var(--danger);color:var(--danger)}
  .manager{flex:none;max-height:55vh;overflow:auto;padding:12px 16px;border-top:1px solid var(--border);background:color-mix(in srgb,var(--bg-elev) 82%,var(--bg))}
  .manager[hidden]{display:none}.manager-head{position:sticky;top:-12px;z-index:2;display:flex;align-items:flex-start;gap:10px;margin:-12px -16px 10px;padding:12px 16px 9px;background:color-mix(in srgb,var(--bg-elev) 94%,var(--bg));border-bottom:1px solid var(--border)}.manager-head>div{flex:1}.manager-head b{font-size:13px}.manager-note{display:block;color:var(--fg-dim);font-size:11.5px;margin-top:2px}
  .manager h3{font-size:12px;margin:11px 0 6px;color:var(--fg-dim);font-weight:600}.manager-list{display:grid;gap:6px}.manager-empty{padding:12px;border:1px dashed var(--border);border-radius:8px;color:var(--fg-dim);text-align:center}
  .manager-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;text-align:left;padding:8px 10px}.manager-row.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .manager-row strong{display:block;font-size:12.5px;font-weight:600}.manager-row small{display:block;color:var(--fg-dim);margin-top:2px}.manager-row.on small{color:var(--fg)}.status-pill{border-radius:999px;padding:2px 7px;background:var(--bg);color:var(--fg-dim);font-size:11px;white-space:nowrap}
  .manager-reason{width:100%;margin-top:10px;border:1px solid var(--border);border-radius:7px;background:var(--bg);color:var(--fg);font:inherit;padding:7px 9px;outline:none}.manager-reason:focus{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 20%,transparent)}
  .manager-actions{position:sticky;bottom:-12px;z-index:2;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:7px;margin:9px -16px -12px;padding:9px 16px 12px;background:color-mix(in srgb,var(--bg-elev) 94%,var(--bg));border-top:1px solid var(--border)}.danger{color:var(--danger)}.boundary{margin-top:8px;padding:7px 9px;border-left:3px solid var(--accent);background:var(--bg);color:var(--fg-dim);font-size:11.5px}
  #candidate-supersede-note{display:block;margin:7px 0 0;padding:6px 8px;border-left:3px solid var(--accent);background:var(--bg);color:var(--fg-dim);font-size:11.5px}#candidate-supersede-note[hidden]{display:none}
</style></head><body><script type="module" src="panel-runtime.js"></script>
<div class="pwin">
  <div class="p-drag"></div>
  <div class="p-winbtns"><button id="p-min" title="最小化"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg></button><button id="p-max" title="最大化/还原"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="1.5"/></svg></button><button class="x" id="p-close" title="关闭"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <header><b>AI 对话整理</b><span class="head-meta" id="meta">等待读取当前网页…</span></header>
  <div class="controls">
    <button data-mode="single">单选</button><button class="on" data-mode="batch">批量选择</button><span class="split"></span>
    <button id="select-all">全选</button><button id="select-invert">反选</button>
    <span class="count" id="count">0 / 0 条</span>
  </div>
  <main class="mazz-scroll" id="list"><div class="empty">正在循环滚顶并识别对话结构…</div></main>
  <section class="candidate-review mazz-scroll" id="candidate-review" hidden>
    <div class="candidate-head"><b>结构化候选审阅</b><span>系统只生成草稿；类型与正文须由你确认。</span></div>
    <div class="candidate-grid">
      <label for="candidate-kind">候选类型</label>
      <select id="candidate-kind"><option value="stage-summary">阶段总结</option><option value="decision">正式决策</option><option value="method">可复用方法</option><option value="finding">事实发现</option></select>
      <label for="candidate-title">候选标题</label><input id="candidate-title" maxlength="500">
      <label for="candidate-statement">候选正文</label><textarea id="candidate-statement" maxlength="100000"></textarea>
    </div>
    <div class="candidate-actions"><button id="candidate-cancel">取消审阅</button><button id="candidate-reject">驳回候选</button><button class="pri" id="candidate-approve">批准入库</button></div>
    <span id="candidate-supersede-note" hidden></span>
  </section>
  <section class="manager mazz-scroll" id="promotion-manager" hidden>
    <div class="manager-head"><div><b>本地升格记录</b><span class="manager-note">管理人工决定与安全证据投影；这里不会把内容发布到 Hub 或公开网络。</span></div><button id="promotion-manager-close">关闭</button></div>
    <h3>升格记录</h3><div class="manager-list" id="promotion-list"><div class="manager-empty">正在读取…</div></div>
    <h3>证据投影</h3><div class="manager-list" id="projection-list"><div class="manager-empty">暂无证据投影</div></div>
    <input class="manager-reason" id="promotion-reason" maxlength="1200" placeholder="填写本次撤销、投影或撤回原因（至少 4 个字）">
    <div class="boundary">证据投影只含身份、类型、来源摘要和哈希证据；不含正文、本地路径、来源网址或消息 ID，且始终标记“未获发布许可”。</div>
    <div class="manager-actions"><button id="promotion-refresh">刷新</button><button id="promotion-supersede-clear">取消替代标记</button><button id="promotion-supersede">下次同类批准替代所选</button><button id="promotion-project">生成证据投影</button><button class="danger" id="promotion-revoke">撤销所选</button><button class="danger" id="projection-withdraw">撤回所选投影</button></div>
  </section>
  <footer>
    <span id="status">角色后的“?”表示启发式推断；点击角色标签可翻转。</span>
    <button id="style">添加到文风素材</button><button id="mindmap">AI 提炼成图</button><button id="candidate-open">提炼结构化候选</button><button id="promote">升格为本地资产</button><button id="promotion-manage">管理升格记录</button><button class="pri" id="export">导出 Markdown</button>
  </footer>
</div>
<script>
const $=selector=>document.querySelector(selector);
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const DATA={meta:null,messages:[],mode:'batch',busy:false,review:null,management:null,selectedPromotionId:'',selectedProjectionId:'',supersede:null};
const pwb=action=>window.mazz.invoke('window:'+action).catch(()=>{});
$('#p-min').addEventListener('click',()=>pwb('minimize'));$('#p-max').addEventListener('click',()=>pwb('toggleMaximize'));$('#p-close').addEventListener('click',()=>pwb('close'));
const applyTheme=(id,vars)=>{if(id)document.documentElement.dataset.theme=id;if(vars)for(const[key,value]of Object.entries(vars))if(value)document.documentElement.style.setProperty('--'+key,value)};
window.mazz.invoke('panel:action',{type:'themeSnapshot'}).catch(()=>{});
window.mazz.on('theme:changed',({id,vars})=>applyTheme(id,vars));

function selected(){return DATA.messages.filter(row=>row.selected)}
function syncCount(){
  $('#count').textContent=`${selected().length} / ${DATA.messages.length} 条`;
  const selectionLocked=Boolean(DATA.review);const disabled=DATA.busy||!selected().length||selectionLocked;
  $('#export').disabled=disabled;$('#style').disabled=disabled;$('#mindmap').disabled=disabled;$('#promote').disabled=disabled;$('#candidate-open').disabled=disabled;
  $('#select-all').disabled=DATA.busy||selectionLocked;$('#select-invert').disabled=DATA.busy||selectionLocked;
  document.querySelectorAll('[data-mode]').forEach(button=>button.disabled=DATA.busy||selectionLocked);
  $('#candidate-kind').disabled=DATA.busy;$('#candidate-title').disabled=DATA.busy;$('#candidate-statement').disabled=DATA.busy;
  $('#candidate-cancel').disabled=DATA.busy;$('#candidate-reject').disabled=DATA.busy;$('#candidate-approve').disabled=DATA.busy;
  $('#promotion-manage').disabled=DATA.busy||selectionLocked;syncManagerControls();
}
function render(){
  if(!DATA.messages.length){$('#list').innerHTML='<div class="empty">没有识别到对话消息</div>';syncCount();return}
  $('#list').innerHTML=DATA.messages.map(row=>`<label class="msg ${row.uncertain?'uncertain':''}" data-id="${esc(row.id)}">
    <input type="checkbox" ${row.selected?'checked':''} ${DATA.review?'disabled':''}>
    <button type="button" class="role ${row.role}" data-role-flip title="点击翻转用户 / AI" ${DATA.review?'disabled':''}>${esc(row.roleLabel)}</button>
    <span class="text">${esc(row.text)}</span>
  </label>`).join('');
  syncCount();
}
$('#list').addEventListener('change',event=>{
  const host=event.target.closest('.msg');if(!host||event.target.type!=='checkbox')return;
  const row=DATA.messages.find(item=>item.id===host.dataset.id);if(!row)return;
  if(DATA.mode==='single'&&event.target.checked)DATA.messages.forEach(item=>{item.selected=item===row});
  else row.selected=event.target.checked;
  render();
});
$('#list').addEventListener('click',event=>{
  const button=event.target.closest('[data-role-flip]');if(!button)return;
  event.preventDefault();const host=button.closest('.msg');const row=DATA.messages.find(item=>item.id===host?.dataset.id);if(!row)return;
  row.role=row.role==='user'?'assistant':'user';row.uncertain=false;row.roleLabel=row.role==='user'?'用户':'AI';render();
});
document.querySelectorAll('[data-mode]').forEach(button=>button.addEventListener('click',()=>{
  DATA.mode=button.dataset.mode;document.querySelectorAll('[data-mode]').forEach(item=>item.classList.toggle('on',item===button));
  if(DATA.mode==='single'&&selected().length>1){let keep=true;DATA.messages.forEach(row=>{if(row.selected){row.selected=keep;keep=false}});render()}
}));
$('#select-all').addEventListener('click',()=>{DATA.messages.forEach((row,index)=>row.selected=DATA.mode==='single'?index===0:true);render()});
$('#select-invert').addEventListener('click',()=>{if(DATA.mode==='single'){const index=DATA.messages.findIndex(row=>row.selected);DATA.messages.forEach((row,i)=>row.selected=i===((index+1)%DATA.messages.length))}else DATA.messages.forEach(row=>row.selected=!row.selected);render()});

async function send(type,label){
  const messages=selected().map(({id,role,roleLabel,uncertain,text})=>({id,role,roleLabel,uncertain,text}));
  if(!messages.length)return;
  DATA.busy=true;$('#status').textContent=label;syncCount();
  if(type==='harvestPromote'&&DATA.supersede?.kind!=='asset'&&DATA.supersede){$('#status').textContent='所选记录不是普通资产，请使用结构化候选审阅完成同类替代。';DATA.busy=false;syncCount();return}
  await window.mazz.invoke('panel:action',{type,meta:DATA.meta,messages,supersedes:DATA.supersede?[DATA.supersede.promotionId]:[]}).catch(error=>{$('#status').textContent=error.message||String(error);DATA.busy=false;syncCount()});
}
$('#export').addEventListener('click',()=>send('harvestExport','正在写入工作区…'));
$('#style').addEventListener('click',()=>send('harvestStyle','正在加入文风素材…'));
$('#mindmap').addEventListener('click',()=>send('harvestMindmap','正在建立无损提炼预览…'));
$('#promote').addEventListener('click',()=>send('harvestPromote','正在登记并升格本地资产…'));

const KIND_LABELS={'stage-summary':'阶段总结',decision:'正式决策',method:'可复用方法',finding:'事实发现'};
function openCandidateReview(){
  const messages=selected().map(({id,role,roleLabel,uncertain,text})=>({id,role,roleLabel,uncertain,text}));if(!messages.length)return;
  if(DATA.supersede?.kind==='asset'){$('#status').textContent='所选记录是普通资产，请使用“升格为本地资产”完成替代。';return}
  $('#promotion-manager').hidden=true;
  DATA.review={messages,proposedAt:new Date().toISOString()};
  $('#candidate-kind').value=DATA.supersede?.kind||'stage-summary';
  const initialLabel=KIND_LABELS[$('#candidate-kind').value];
  $('#candidate-title').value=`${DATA.meta?.topic||DATA.meta?.title||'未命名对话'} · ${initialLabel}`;
  $('#candidate-statement').value=messages.map(row=>`${row.roleLabel||row.role}：${row.text}`).join('\n\n').slice(0,100000);
  $('#candidate-supersede-note').hidden=!DATA.supersede;$('#candidate-supersede-note').textContent=DATA.supersede?'本次批准将替代所选同类 active 记录；旧记录保留并标记为“已替代”。':'';
  $('#candidate-review').hidden=false;$('#status').textContent='请审阅候选类型、标题与正文，再明确批准或驳回。';render();
  $('#candidate-title').focus();
}
function closeCandidateReview(){DATA.review=null;$('#candidate-review').hidden=true;render()}
$('#candidate-open').addEventListener('click',openCandidateReview);
$('#candidate-kind').addEventListener('change',()=>{
  const old=Object.values(KIND_LABELS).find(label=>$('#candidate-title').value.endsWith(` · ${label}`));
  if(old)$('#candidate-title').value=$('#candidate-title').value.slice(0,-(` · ${old}`).length)+` · ${KIND_LABELS[$('#candidate-kind').value]}`;
});
$('#candidate-cancel').addEventListener('click',()=>{closeCandidateReview();$('#status').textContent='已取消本次结构化候选审阅。'});
async function decideCandidate(action){
  if(!DATA.review)return;const title=$('#candidate-title').value.trim();const statement=$('#candidate-statement').value.trim();
  if(!title||!statement){$('#status').textContent='候选标题和正文不能为空。';return}
  DATA.busy=true;$('#status').textContent=action==='approve'?'正在批准并登记候选…':'正在登记驳回决定…';syncCount();
  const review={kind:$('#candidate-kind').value,title,statement,action,proposedAt:DATA.review.proposedAt,supersedes:action==='approve'&&DATA.supersede?[DATA.supersede.promotionId]:[]};
  await window.mazz.invoke('panel:action',{type:'harvestReviewPromotion',meta:DATA.meta,messages:DATA.review.messages,review})
    .catch(error=>{$('#status').textContent=error.message||String(error);DATA.busy=false;syncCount()});
}
$('#candidate-approve').addEventListener('click',()=>decideCandidate('approve'));
$('#candidate-reject').addEventListener('click',()=>decideCandidate('reject'));

const PROMOTION_KIND_LABELS={asset:'本地资产','stage-summary':'阶段总结',decision:'正式决策',method:'可复用方法',finding:'事实发现'};
const STATUS_LABELS={active:'有效',rejected:'已驳回',revoked:'已撤销',superseded:'已替代',withdrawn:'已撤回'};
function promotionEntries(){return DATA.management?.promotions?.entries||[]}
function projectionEntries(){return DATA.management?.projections?.entries||[]}
function syncManagerControls(){
  const promotion=promotionEntries().find(row=>row.promotionId===DATA.selectedPromotionId);
  const projection=projectionEntries().find(row=>row.projectionId===DATA.selectedProjectionId);
  const alreadyProjected=projectionEntries().some(row=>row.promotionId===promotion?.promotionId);
  $('#promotion-refresh').disabled=DATA.busy;$('#promotion-manager-close').disabled=DATA.busy;
  $('#promotion-supersede').disabled=DATA.busy||promotion?.status!=='active';$('#promotion-supersede-clear').disabled=DATA.busy||!DATA.supersede;
  $('#promotion-revoke').disabled=DATA.busy||promotion?.status!=='active';$('#promotion-project').disabled=DATA.busy||promotion?.status!=='active'||alreadyProjected;
  $('#projection-withdraw').disabled=DATA.busy||projection?.status!=='active';$('#promotion-reason').disabled=DATA.busy;
}
function renderPromotionManagement(){
  const promotions=promotionEntries(),projections=projectionEntries();
  if(!promotions.some(row=>row.promotionId===DATA.selectedPromotionId))DATA.selectedPromotionId=promotions.find(row=>row.status==='active')?.promotionId||promotions[0]?.promotionId||'';
  if(!projections.some(row=>row.projectionId===DATA.selectedProjectionId))DATA.selectedProjectionId=projections.find(row=>row.status==='active')?.projectionId||projections[0]?.projectionId||'';
  $('#promotion-list').innerHTML=promotions.length?promotions.map(row=>{
    const site=row.candidate?.sourceRef?.site||'本地来源',kind=PROMOTION_KIND_LABELS[row.candidate?.kind]||'升格记录';
    const stamp=String(row.decidedAt||'').replace('T',' ').slice(0,16);
    return `<button class="manager-row ${row.promotionId===DATA.selectedPromotionId?'on':''}" data-promotion-id="${esc(row.promotionId)}"><span><strong>${esc(kind)} · ${esc(site)}</strong><small>${esc(stamp)}${row.supersededBy?' · 已由后续记录替代':''}</small></span><span class="status-pill">${esc(STATUS_LABELS[row.status]||row.status)}</span></button>`;
  }).join(''):'<div class="manager-empty">还没有升格记录</div>';
  $('#projection-list').innerHTML=projections.length?projections.map(row=>{
    const source=promotions.find(item=>item.promotionId===row.promotionId),kind=PROMOTION_KIND_LABELS[source?.candidate?.kind]||'证据';
    const blocked=row.status==='active'&&source?.status!=='active';
    return `<button class="manager-row ${row.projectionId===DATA.selectedProjectionId?'on':''}" data-projection-id="${esc(row.projectionId)}"><span><strong>${esc(kind)}证据投影</strong><small>${blocked?'来源已失效，不可进入发布闸':'不含正文与本地路径；未获发布许可'}</small></span><span class="status-pill">${esc(blocked?'来源失效':STATUS_LABELS[row.status]||row.status)}</span></button>`;
  }).join(''):'<div class="manager-empty">暂无证据投影</div>';
  syncManagerControls();
}
async function requestPromotionManagement(message='正在读取升格记录…'){
  DATA.busy=true;$('#promotion-manager').hidden=false;$('#candidate-review').hidden=true;DATA.review=null;$('#status').textContent=message;syncCount();
  await window.mazz.invoke('panel:action',{type:'harvestPromotionList'}).catch(error=>{$('#status').textContent=error.message||String(error);DATA.busy=false;syncCount()});
}
async function promotionManagerAction(type,payload,label){
  DATA.busy=true;$('#status').textContent=label;syncCount();
  await window.mazz.invoke('panel:action',{type,...payload}).catch(error=>{$('#status').textContent=error.message||String(error);DATA.busy=false;syncCount()});
}
$('#promotion-manage').addEventListener('click',()=>requestPromotionManagement());$('#promotion-refresh').addEventListener('click',()=>requestPromotionManagement('正在刷新升格记录…'));
$('#promotion-manager-close').addEventListener('click',()=>{$('#promotion-manager').hidden=true;$('#status').textContent='已关闭升格记录管理。'});
$('#promotion-list').addEventListener('click',event=>{const row=event.target.closest('[data-promotion-id]');if(!row)return;DATA.selectedPromotionId=row.dataset.promotionId;renderPromotionManagement()});
$('#projection-list').addEventListener('click',event=>{const row=event.target.closest('[data-projection-id]');if(!row)return;DATA.selectedProjectionId=row.dataset.projectionId;renderPromotionManagement()});
$('#promotion-supersede').addEventListener('click',()=>{const row=promotionEntries().find(item=>item.promotionId===DATA.selectedPromotionId);if(!row||row.status!=='active')return;DATA.supersede={promotionId:row.promotionId,kind:row.candidate?.kind};$('#promotion-manager').hidden=true;$('#status').textContent=row.candidate?.kind==='asset'?'已标记替代目标；选择消息后点击“升格为本地资产”。':'已标记同类替代目标；选择消息后打开结构化候选审阅。';syncCount()});
$('#promotion-supersede-clear').addEventListener('click',()=>{DATA.supersede=null;$('#status').textContent='已取消替代标记。';syncCount()});
$('#promotion-revoke').addEventListener('click',()=>promotionManagerAction('harvestPromotionRevoke',{promotionId:DATA.selectedPromotionId,reason:$('#promotion-reason').value},'正在撤销所选升格记录…'));
$('#promotion-project').addEventListener('click',()=>promotionManagerAction('harvestPromotionProject',{promotionId:DATA.selectedPromotionId,reason:$('#promotion-reason').value},'正在生成安全证据投影…'));
$('#projection-withdraw').addEventListener('click',()=>{const row=projectionEntries().find(item=>item.projectionId===DATA.selectedProjectionId);if(!row)return;promotionManagerAction('harvestProjectionWithdraw',{promotionId:row.promotionId,reason:$('#promotion-reason').value},'正在撤回所选证据投影…')});

window.mazz.on('panel:push',payload=>{
  if(payload?.type==='themeInit'){applyTheme(payload.id,payload.vars);return}
  if(payload?.type==='harvestLoading'){$('#status').textContent=payload.message||'正在读取网页…';return}
  if(payload?.type==='harvestSnapshot'){
    DATA.meta=payload.meta||{};DATA.messages=(payload.messages||[]).map(row=>({...row,selected:true}));
    $('#meta').textContent=`${DATA.meta.site||'通用网页对话'} · ${DATA.meta.topic||DATA.meta.title||'未命名'} · 滚顶 ${DATA.meta.scrollPasses||0} 轮`;
    $('#status').textContent=`识别到 ${DATA.messages.length} 条消息；“?”角色可点击翻转。`;DATA.busy=false;render();return;
  }
  if(payload?.type==='harvestResult'){DATA.busy=false;if(payload.closeReview){DATA.review=null;$('#candidate-review').hidden=true}if(payload.clearSupersedes)DATA.supersede=null;$('#status').textContent=payload.message||'处理完成';render();return}
  if(payload?.type==='harvestPromotionManagement'){DATA.busy=false;DATA.management=payload.management||null;$('#promotion-manager').hidden=false;$('#promotion-reason').value='';$('#status').textContent=payload.message||'升格记录已刷新。';renderPromotionManagement();syncCount();return}
  if(payload?.type==='harvestError'){DATA.busy=false;$('#status').textContent=payload.message||'读取失败';if(payload.preserveSelection){syncCount();return}DATA.messages=[];$('#list').innerHTML=`<div class="empty">${esc(payload.message||'读取失败')}</div>`;syncCount()}
});
</script></body></html>
