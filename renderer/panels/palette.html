<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Quick Switcher</title>
<link rel="stylesheet" href="../styles/themes.css">
<link rel="stylesheet" href="panel-shared.css"> <!-- 军规④：滚动条族消费方真实加载（base.css 面板窗不载——写了不算做了病绝育） -->
<style>
  html, body { background: transparent; margin: 0; height: 100%; overflow: hidden; } /* W58f：锁文档级滚动——滚动只发生在内层容器（外飘轨双滚动条实锤） */
  * { box-sizing: border-box; }
  body { margin:0; font:13px/1.5 var(--font-ui); }
  .pwin { display:flex; flex-direction:column; height:100vh; background:var(--bg); color:var(--fg); border-radius:12px; overflow:hidden; border:1px solid var(--border); box-shadow:0 10px 36px rgba(0,0,0,.4); }
  .p-drag { height:12px; flex:none; -webkit-app-region:drag; }
  .p-winbtns { position:absolute; top:2px; right:8px; display:flex; gap:2px; z-index:9; }
  .p-winbtns button { display:inline-flex; align-items:center; justify-content:center; -webkit-app-region:no-drag; width:30px; height:22px; border:0; border-radius:6px; background:transparent; color:var(--fg-dim); cursor:pointer; font-size:12px; }
  .p-winbtns button:hover { background:var(--bg-hover); color:var(--fg); }
  .p-winbtns button.x:hover { background:#e81123; color:#fff; }
  .head { display:flex; align-items:center; gap:10px; padding:10px 14px 12px; border-bottom:1px solid var(--border); background:var(--bg-elev); flex:none; }
  .qs-mark { color:var(--accent); font:700 16px/1 var(--font-mono); }
  .head input { flex:1; border:1px solid var(--border); background:var(--bg); color:var(--fg); border-radius:8px; padding:8px 12px; font-size:14px; outline:none; font-family:var(--font-ui); }
  .head input:focus { border-color:var(--accent); }
  main { flex:1; min-height:0; padding:6px 8px; overflow-y:auto; }
  .row { display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:9px; min-height:54px; padding:7px 10px; border-radius:8px; cursor:pointer; }
  .row.on, .row:hover { background:var(--accent-soft); }
  .row .body { min-width:0; }
  .row .t { font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .meta, .row .preview { margin-top:2px; font-size:11px; color:var(--fg-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .preview { color:var(--fg-muted, var(--fg-dim)); font-family:var(--font-mono); }
  .row kbd { background:var(--bg-active); border-radius:4px; padding:0 7px; font-family:var(--font-mono); font-size:11px; color:var(--fg-dim); }
  .empty { color:var(--fg-dim); text-align:center; padding:44px 0; }
  .kind { min-width:34px; padding:2px 6px; border:1px solid var(--border); border-radius:5px; color:var(--fg-dim); font-size:10.5px; text-align:center; }
  .kind-recent { color:#d59628; border-color:color-mix(in srgb,#d59628 44%,transparent); background:color-mix(in srgb,#d59628 10%,transparent); }
  .kind-file { color:#54a1dd; border-color:color-mix(in srgb,#54a1dd 44%,transparent); background:color-mix(in srgb,#54a1dd 10%,transparent); }
  .kind-command { color:#aa82e6; border-color:color-mix(in srgb,#aa82e6 44%,transparent); background:color-mix(in srgb,#aa82e6 10%,transparent); }
  .kind-content { color:#46ad7b; border-color:color-mix(in srgb,#46ad7b 44%,transparent); background:color-mix(in srgb,#46ad7b 10%,transparent); }
  .foot { flex:none; display:flex; gap:14px; padding:5px 16px 7px; border-top:1px solid var(--border); color:var(--fg-dim); font-size:10.5px; }
</style></head><body>
<div class="pwin">
  <div class="p-drag"></div>
  <div class="p-winbtns"><button id="p-min" title="最小化"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg></button><button id="p-max" title="最大化/还原"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="1.5"/></svg></button><button class="x" id="p-close" title="关闭"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="head">
    <span class="qs-mark">›</span>
    <input id="q" placeholder="搜索文件、命令、最近打开和全文内容…" aria-label="Quick Switcher 搜索" autofocus autocomplete="off" spellcheck="false">
  </div>
  <main id="m" class="mazz-scroll"></main>
  <div class="foot"><span>↑↓ 选择</span><span>Enter 直达</span><span>Esc 关闭</span></div>
</div>
<script>
const $ = (s) => document.querySelector(s);
const pwb=(a)=>window.mazz.invoke('window:'+a).catch(()=>{});
$('#p-min').addEventListener('click',()=>pwb('minimize'));
$('#p-max').addEventListener('click',()=>pwb('toggleMaximize'));
$('#p-close').addEventListener('click',()=>pwb('close'));
const applyTheme=(id,vars)=>{ if(id) document.documentElement.dataset.theme=id; if(vars) for(const [k,v] of Object.entries(vars)) if(v) document.documentElement.style.setProperty('--'+k,v); };
window.mazz.invoke('panel:action',{type:'themeSnapshot'}).catch(()=>{});
window.mazz.on('theme:changed',({id,vars})=>applyTheme(id,vars));
window.mazz.on('panel:push',(p)=>{ if(p?.type==='themeInit') applyTheme(p.id,p.vars); });
const esc=(s)=>String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
let items = [], sel = 0, qT = null, issued = 0, applied = 0;
function ask() {
  clearTimeout(qT);
  const requestId = ++issued;
  qT = setTimeout(() => window.mazz.invoke('panel:action', {
    type: 'quickSwitcherQuery', requestId, q: $('#q').value.trim(),
  }).catch(() => {}), 80);
}
function render() {
  const m = $('#m');
  if (!items.length) { m.innerHTML = '<div class="empty">没有找到可直达的结果</div>'; return; }
  m.innerHTML = items.map((it, i) => '<div class="row' + (i === sel ? ' on' : '') + '" data-i="' + i + '">'
    + '<span class="kind kind-' + esc(it.kind) + '">' + esc(it.sourceLabel || it.kind) + '</span>'
    + '<span class="body"><div class="t">' + esc(it.title) + '</div>'
    + (it.detail ? '<div class="meta">' + esc(it.detail) + '</div>' : '')
    + (it.preview ? '<div class="preview">' + esc(it.preview) + '</div>' : '') + '</span>'
    + (it.key ? '<kbd>' + esc(it.key) + '</kbd>' : '') + '</div>').join('');
  m.querySelectorAll('.row').forEach(r => {
    r.addEventListener('mouseenter', () => {
      sel = +r.dataset.i;
      m.querySelectorAll('.row').forEach((node, index) => node.classList.toggle('on', index === sel));
    });
    r.addEventListener('click', () => run(items[+r.dataset.i]));
  });
  m.querySelector('.row.on')?.scrollIntoView({ block: 'nearest' });
}
function run(it) {
  if (!it) return;
  window.mazz.invoke('panel:action', { type: 'quickSwitcherRun', item: it }).catch(() => {});
  window.mazz.invoke('panel:close', { kind: 'palette' }).catch(() => {});
}
$('#q').addEventListener('input', () => { sel = 0; items = []; render(); ask(); });
$('#q').addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown') { e.preventDefault(); sel = Math.min(items.length - 1, sel + 1); render(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); sel = Math.max(0, sel - 1); render(); }
  else if (e.key === 'Enter') { e.preventDefault(); run(items[sel]); }
  else if (e.key === 'Escape') pwb('close');
});
window.mazz.on('panel:push', (p) => {
  if (p?.type !== 'quickSwitcherItems' || !Array.isArray(p.items)) return;
  if (p.requestId < issued || p.requestId < applied) return;
  applied = p.requestId;
  items = p.items;
  if (sel >= items.length) sel = Math.max(0, items.length - 1);
  render();
});
ask();
</script></body></html>
