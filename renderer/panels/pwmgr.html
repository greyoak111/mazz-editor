<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>密码管理器</title>
<link rel="stylesheet" href="../styles/themes.css">
<link rel="stylesheet" href="panel-shared.css"> <!-- 军规④：滚动条族消费方真实加载（base.css 面板窗不载——写了不算做了病绝育） -->
<style>
  html, body { background: transparent; margin: 0; height: 100%; overflow: hidden; } /* W58f：锁文档级滚动——滚动只发生在内层容器（外飘轨双滚动条实锤） */
  * { box-sizing: border-box; }
  body { margin:0; font:13px/1.6 var(--font-ui); }
  .pwin { display:flex; flex-direction:column; height:100vh; background:var(--bg); color:var(--fg); border-radius:12px; overflow:hidden; border:1px solid var(--border); box-shadow:0 10px 36px rgba(0,0,0,.4); }
  .p-drag { height:12px; flex:none; -webkit-app-region:drag; }
  .p-winbtns { position:absolute; top:2px; right:8px; display:flex; gap:2px; z-index:9; }
  .p-winbtns button { display:inline-flex; align-items:center; justify-content:center; -webkit-app-region:no-drag; width:30px; height:22px; border:0; border-radius:6px; background:transparent; color:var(--fg-dim); cursor:pointer; font-size:12px; }
  .p-winbtns button:hover { background:var(--bg-hover); color:var(--fg); }
  .p-winbtns button.x:hover { background:#e81123; color:#fff; }
  header { display:flex; align-items:center; gap:10px; padding:10px 16px; border-bottom:1px solid var(--border); background:var(--bg-elev); flex:none; }
  header b { font-size:15px; flex:1; }
  header small { color:var(--fg-dim); }
  button { border:1px solid var(--border); background:var(--bg-elev); color:var(--fg); border-radius:7px; padding:4px 10px; cursor:pointer; font-size:12.5px; }
  button:hover { border-color:var(--accent); color:var(--accent); }
  button.pri { background:var(--accent); color:var(--accent-fg,#fff); border-color:var(--accent); }
  main { padding:12px 16px; overflow:auto; flex:1; }
  .add { display:grid; grid-template-columns:1.2fr 1fr 1fr; gap:8px; background:var(--bg-elev); border:1px solid var(--border); border-radius:10px; padding:12px; margin-bottom:12px; }
  .add input { border:1px solid var(--border); background:var(--bg); color:var(--fg); border-radius:7px; padding:6px 10px; font-size:13px; outline:none; width:100%; }
  .add input:focus { border-color:var(--accent); }
  .row { display:flex; align-items:center; gap:10px; background:var(--bg-elev); border:1px solid var(--border); border-radius:10px; padding:9px 12px; margin-bottom:8px; }
  .row .site { flex:1.2; min-width:0; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .user { flex:1; min-width:0; color:var(--fg-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .pw { font-family:var(--font-mono,monospace); letter-spacing:1px; }
  .row .note { color:var(--fg-dim); font-size:11.5px; max-width:20%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .empty { color:var(--fg-dim); text-align:center; padding:40px 0; }
</style></head><body>
<div class="pwin">
  <div class="p-drag"></div>
  <div class="p-winbtns"><button id="p-min" title="最小化"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg></button><button id="p-max" title="最大化/还原"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="1.5"/></svg></button><button class="x" id="p-close" title="关闭"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <header><b>密码管理器</b><small>系统级加密存储（safeStorage）</small><span id="st" style="color:var(--fg-dim);font-size:12px"></span></header>
  <main class="mazz-scroll">
    <div class="add">
      <input id="a-site" placeholder="站点（如 bilibili.com）">
      <input id="a-user" placeholder="账号">
      <input id="a-pw" placeholder="密码" type="password">
      <input id="a-note" placeholder="备注（可选）">
      <span></span>
      <button class="pri" id="a-btn">添加账号</button>
    </div>
    <div id="list"></div>
  </main>
</div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const pwb=(a)=>window.mazz.invoke('window:'+a).catch(()=>{});
$('#p-min').addEventListener('click',()=>pwb('minimize'));
$('#p-max').addEventListener('click',()=>pwb('toggleMaximize'));
$('#p-close').addEventListener('click',()=>pwb('close'));
const applyTheme=(id,vars)=>{ if(id) document.documentElement.dataset.theme=id; if(vars) for(const [k,v] of Object.entries(vars)) if(v) document.documentElement.style.setProperty('--'+k,v); };
window.mazz.invoke('panel:action',{type:'themeSnapshot'}).catch(()=>{});
window.mazz.on('theme:changed',({id,vars})=>applyTheme(id,vars));
window.mazz.on('panel:push',(p)=>{ if(p?.type==='themeInit') applyTheme(p.id,p.vars); });
let list = [];
async function load() {
  list = (await window.mazz.invoke('pw:list').catch(() => [])) || [];
  render();
}
function render() {
  $('#list').innerHTML = list.length ? list.map(e => '<div class="row" data-id="' + e.id + '">'
    + '<span class="site" title="' + esc(e.site) + '">' + esc(e.site) + '</span>'
    + '<span class="user">' + esc(e.username) + '</span>'
    + '<span class="pw" data-pw="' + esc(e.password || '') + '">••••••</span>'
    + '<span class="note">' + esc(e.note || '') + '</span>'
    + '<span class="acts"><button data-a="show">显示</button> <button data-a="fill">填充</button> <button data-a="del">删除</button></span>'
    + '</div>').join('')
    : '<div class="empty">还没有保存的账号——上面表单添加<br><small style="opacity:.7">在网页登录时也会询问保存（Edge 同款）</small></div>';
}
$('#list').addEventListener('click', async (e) => {
  const a = e.target.dataset && e.target.dataset.a;
  const row = e.target.closest('.row');
  if (!a || !row) return;
  const id = row.dataset.id;
  const en = list.find(x => x.id === id);
  if (a === 'show') {
    const el = row.querySelector('.pw');
    const showing = el.textContent !== '••••••';
    el.textContent = showing ? '••••••' : (el.dataset.pw || '');
    e.target.textContent = showing ? '显示' : '隐藏';
  }
  if (a === 'fill') window.mazz.invoke('panel:action', { type: 'fillPassword', id }).catch(() => {});
  if (a === 'del') { if (!confirm('删除「' + (en ? en.site : id) + '」的账号？')) return; await window.mazz.invoke('pw:delete', { id }); await save('已删除'); }
});
$('#a-btn').addEventListener('click', async () => {
  const entry = { site: $('#a-site').value.trim(), username: $('#a-user').value.trim(), password: $('#a-pw').value, note: $('#a-note').value.trim() };
  if (!entry.site || !entry.username || !entry.password) { $('#st').textContent = '站点/账号/密码必填'; setTimeout(() => { $('#st').textContent = ''; }, 2400); return; }
  await window.mazz.invoke('pw:save', { entry }).catch(() => null);
  $('#a-site').value = $('#a-user').value = $('#a-pw').value = $('#a-note').value = '';
  await save('已添加');
});
async function save(msg) {
  window.mazz.invoke('panel:changed', { kind: 'pwmgr' }).catch(() => {});
  $('#st').textContent = msg || '';
  setTimeout(() => { $('#st').textContent = ''; }, 2400);
  await load();
}
load();
</script></body></html>
