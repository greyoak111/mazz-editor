<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>翻译</title>
<link rel="stylesheet" href="../styles/themes.css">
<link rel="stylesheet" href="panel-shared.css">
<style>
  html, body { background: transparent; margin: 0; height: 100%; overflow: hidden; } /* W58f：锁文档级滚动——滚动只发生在内层容器（外飘轨双滚动条实锤） */
  * { box-sizing: border-box; }
  body { margin:0; font:13px/1.5 var(--font-ui); }
  .pwin { display:flex; flex-direction:column; height:100vh; background:var(--bg); color:var(--fg); border-radius:12px; overflow:hidden; border:1px solid var(--border); box-shadow:0 10px 36px rgba(0,0,0,.4); }
  .p-drag { height:12px; flex:none; -webkit-app-region:drag; }
  .p-winbtns { position:absolute; top:2px; right:8px; display:flex; gap:2px; z-index:9; }
  .p-winbtns button { display:inline-flex; align-items:center; justify-content:center; -webkit-app-region:no-drag; width:30px; height:22px; border:0; border-radius:6px; background:transparent; color:var(--fg-dim); cursor:pointer; font-size:12px; }
  .p-winbtns button:hover { background:var(--bg-hover); color:var(--fg); }
  .p-winbtns button.x:hover { background:#e81123; color:#fff; }
  .head { display:flex; align-items:center; gap:8px; padding:10px 16px; border-bottom:1px solid var(--border); background:var(--bg-elev); flex:none; }
  .head .t { font-size:15px; font-weight:600; flex:1; }
  .head .gear { display:inline-flex; align-items:center; gap:5px; border:1px solid var(--border); background:var(--bg); color:var(--fg-dim); border-radius:7px; padding:4px 12px; font-size:12px; cursor:pointer; font-family:var(--font-ui); }
  .head .gear:hover { color:var(--accent); border-color:var(--accent); }
  main { flex:1; min-height:0; display:flex; flex-direction:column; padding:12px 16px; gap:10px; overflow-y:auto; }
  .tr-grid { flex:1; min-height:0; display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .tr-col { display:flex; flex-direction:column; gap:5px; min-height:0; }
  .tr-label { font-size:12px; color:var(--fg-dim); display:flex; align-items:center; gap:6px; }
  textarea { flex:1; min-height:90px; resize:none; border:1px solid var(--border); background:var(--bg); color:var(--fg); border-radius:6px; padding:8px 10px; font-size:13px; line-height:1.7; font-family:var(--font-ui); }
  textarea:focus { border-color:var(--accent); outline:none; }
  .sel { border:1px solid var(--border); background:var(--bg); color:var(--fg); border-radius:6px; padding:3px 8px; font-size:12px; font-family:var(--font-ui); }
  .acts { display:flex; gap:8px; align-items:center; flex:none; }
  .btn { border:1px solid var(--border); background:var(--bg); color:var(--fg); border-radius:6px; padding:6px 8px; font-size:12px; cursor:pointer; font-family:var(--font-ui); }
  .btn:hover { border-color:var(--accent); color:var(--accent); }
  .btn.pri { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); }
  .btn:disabled { opacity:.58; cursor:default; }
  .hint { font-size:11px; color:var(--fg-dim); }
  /* 引擎设置抽屉 */
  .cfg { display:none; flex:none; border:1px solid var(--border); border-radius:10px; padding:12px 14px; background:var(--bg-elev); flex-direction:column; gap:8px; }
  .cfg.open { display:flex; }
  .cfg .row { display:flex; align-items:center; gap:8px; }
  .cfg .row label { width:74px; flex:none; font-size:12px; color:var(--fg); }
  .cfg .inp { flex:1; border:1px solid var(--border); background:var(--bg); color:var(--fg); border-radius:6px; padding:5px 9px; font-size:12px; font-family:var(--font-ui); }
  .cfg textarea.sys { min-height:60px; font-size:12px; }
</style></head><body><script type="module" src="panel-runtime.js"></script>
<div class="pwin">
  <div class="p-drag"></div>
  <div class="p-winbtns"><button id="p-min" title="最小化"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg></button><button id="p-max" title="最大化/还原"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="1.5"/></svg></button><button class="x" id="p-close" title="关闭"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="head"><span class="t">翻译</span><button class="gear" id="cfg-toggle"><svg aria-hidden="true" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06-2.83 2.83-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21h-4v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06-2.83-2.83.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3v-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06L7.04 4.3l.06.06A1.65 1.65 0 0 0 8.92 4a1.65 1.65 0 0 0 1-1.51V2h4v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06 2.83 2.83-.06.06A1.65 1.65 0 0 0 19.4 9c.12.6.65 1 1.26 1H21v4h-.34c-.61 0-1.14.4-1.26 1Z"/></svg><span>引擎设置</span></button></div>
  <main class="ps-scroll-y">
    <div class="cfg" id="cfg">
      <div class="row"><label>引擎</label>
        <select id="c-engine" class="sel">
          <option value="mymemory">MyMemory（免 key，日限额）</option>
          <option value="libretranslate">LibreTranslate（自部署）</option>
        </select></div>
      <div class="row"><label>实例地址</label><input id="c-url" class="inp" placeholder="https://your-libretranslate.host"></div>
      <div class="row"><label>API Key</label><input id="c-key" class="inp" type="password"></div>
      <div class="row" style="align-items:flex-start"><label>AI 提示词</label>
        <textarea id="c-sys" class="inp sys" rows="3" placeholder="留空使用内置翻译提示词工程（铁律：只出译文/保留格式/信达雅/术语统一）"></textarea></div>
      <div class="row"><label></label><button class="btn pri" id="c-save">保存</button><span id="c-status" class="hint"></span></div>
    </div>
    <div class="tr-grid">
      <div class="tr-col">
        <div class="tr-label">原文</div>
        <textarea id="src" spellcheck="false" placeholder="输入或粘贴要翻译的文本…"></textarea>
      </div>
      <div class="tr-col">
        <div class="tr-label">译文
          <select id="target" class="sel"></select>
          <select id="source" class="sel"><option value="auto">自动检测</option></select>
        </div>
        <textarea id="out" readonly placeholder="译文…"></textarea>
      </div>
    </div>
    <div class="acts">
      <button class="btn pri" id="go">翻译</button>
      <button class="btn" id="copy" disabled>复制译文</button>
      <button class="btn" id="replace" disabled>替换选区</button>
      <button class="btn" id="insert" disabled>插入到光标</button>
      <span class="hint" id="act-hint"></span>
    </div>
  </main>
</div>
<script>
const $ = (s) => document.querySelector(s);
const pwb = (a) => window.mazz.invoke('window:' + a).catch(() => {});
$('#p-min').addEventListener('click', () => pwb('minimize'));
$('#p-max').addEventListener('click', () => pwb('toggleMaximize'));
$('#p-close').addEventListener('click', () => pwb('close'));
const applyTheme = (id, vars) => { if (id) document.documentElement.dataset.theme = id; if (vars) for (const [k, v] of Object.entries(vars)) if (v) document.documentElement.style.setProperty('--' + k, v); };
window.mazz.invoke('panel:action', { type: 'themeSnapshot' }).catch(() => {});
window.mazz.on('theme:changed', ({ id, vars }) => applyTheme(id, vars));
window.mazz.on('panel:push', (p) => { if (p?.type === 'themeInit') applyTheme(p.id, p.vars); });

const LANGS = [['zh-CN','中文'],['en','英语'],['ja','日语'],['ko','韩语'],['fr','法语'],['de','德语'],['es','西班牙语'],['ru','俄语']];
$('#target').innerHTML = LANGS.map(([v,n]) => `<option value="${v}">${n}</option>`).join('');
$('#source').innerHTML += LANGS.map(([v,n]) => `<option value="${v}">${n}</option>`).join('');

// 初始文本（主窗选区透传）
window.mazz.invoke('panel:action', { type: 'translateQueryInit' }).catch(() => {});
window.mazz.on('panel:push', (p) => {
  if (p?.type === 'translateInit' && p.text) $('#src').value = p.text;
  if (p?.type === 'translateActResult' && p.msg) { $('#act-hint').textContent = p.msg; setTimeout(() => { $('#act-hint').textContent = ''; }, 2000); }
});

$('#go').addEventListener('click', async () => {
  const text = $('#src').value.trim();
  if (!text) return;
  $('#out').value = '翻译中…';
  $('#copy').disabled = true;
  try {
    const r = await window.mazz.invoke('tr:translate', { text, from: $('#source').value, to: $('#target').value });
    $('#out').value = r.text || '（无结果）';
    $('#copy').disabled = !r.text;
    $('#replace').disabled = !r.text;
    $('#insert').disabled = !r.text;
  } catch (e) {
    $('#out').value = '翻译失败：' + (e.message || e) + '\n\n（未配置 AI；免费引擎有日限额，也可在引擎设置改配 LibreTranslate 自部署实例）';
  }
});
// W56 B7：替换/插入跨窗桥（panel:action 同款成熟模式——主窗对当前编辑器选区执行）
function editorAct(actName) {
  const text = $('#out').value;
  if (!text) return;
  window.mazz.invoke('panel:action', { type: 'translateAction', act: actName, text }).catch(() => {});
}
$('#replace').addEventListener('click', () => editorAct('replace'));
$('#insert').addEventListener('click', () => editorAct('insert'));
$('#copy').addEventListener('click', async () => {
  await window.mazz.invoke('clipboard:write', { text: $('#out').value }).catch(() => {});
  $('#copy').textContent = '已复制';
  setTimeout(() => { $('#copy').textContent = '复制译文'; }, 1200);
});

// 引擎设置抽屉（tr:getConfig/tr:setConfig 白名单直调）
$('#cfg-toggle').addEventListener('click', async () => {
  const cfg = $('#cfg');
  cfg.classList.toggle('open');
  if (!cfg.classList.contains('open')) return;
  const c = await window.mazz.invoke('tr:getConfig').catch(() => ({}));
  $('#c-engine').value = c.engine === 'libretranslate' ? 'libretranslate' : 'mymemory';
  $('#c-url').value = c.ltUrl || '';
  $('#c-key').placeholder = c.ltKeySet ? '（已设置，留空保持不变）' : '（可选）';
  const sys = await window.mazz.invoke('settings:get', { key: 'mazz.translate.sysPrompt' }).catch(() => '');
  $('#c-sys').value = sys || '';
});
$('#c-save').addEventListener('click', async () => {
  const engine = $('#c-engine').value, ltUrl = $('#c-url').value.trim(), ltKey = $('#c-key').value;
  await window.mazz.invoke('tr:setConfig', { engine, ltUrl, ...(ltKey ? { ltKey } : {}) }).catch(() => {});
  await window.mazz.invoke('settings:set', { key: 'mazz.translate.sysPrompt', value: $('#c-sys').value }).catch(() => {});
  $('#c-status').textContent = '已保存';
  setTimeout(() => { $('#c-status').textContent = ''; }, 1500);
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') pwb('close'); });
</script>
</body></html>
