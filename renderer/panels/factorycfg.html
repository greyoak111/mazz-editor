<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>新项目立项</title>
<link rel="stylesheet" href="../styles/themes.css">
<link rel="stylesheet" href="panel-shared.css">
<style>
  html, body { background: transparent; margin: 0; height: 100%; overflow: hidden; } /* W58f：锁文档级滚动——滚动只发生在内层容器（外飘轨双滚动条实锤） */
  * { box-sizing: border-box; }
  body { margin:0; font:13px/1.5 var(--font-ui); }
  .pwin { display:flex; flex-direction:column; height:100vh; background:var(--bg); color:var(--fg); border-radius:12px; overflow:hidden; border:1px solid var(--border); box-shadow:0 10px 36px rgba(0,0,0,.4); }
  .p-drag { height:12px; flex:none; -webkit-app-region:drag; }
  .p-winbtns { position:absolute; top:2px; right:8px; display:flex; gap:2px; z-index:9; }
  .p-winbtns button { display:inline-flex; align-items:center; justify-content:center; -webkit-app-region:no-drag; width:30px; height:22px; border:0; border-radius:6px; background:transparent; color:var(--fg-dim); cursor:pointer; font-size:12px; }
  .p-winbtns button:hover { background:var(--bg-hover); color:var(--fg); }
  .p-winbtns button.x:hover { background:#e81123; color:#fff; }
  .head { min-height:48px; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:7px 104px 7px 14px; border-bottom:1px solid var(--border); background:var(--bg-elev); flex:none; }
  .head-primary, .head-actions { display:flex; align-items:center; gap:9px; min-width:0; }
  .head-title { margin:0; overflow:hidden; color:var(--fg); font-size:15px; font-weight:700; text-overflow:ellipsis; white-space:nowrap; }
  .head-subtitle { overflow:hidden; color:var(--fg-dim); font-size:11.5px; text-overflow:ellipsis; white-space:nowrap; }
  .head-back, .head-settings { min-height:32px; flex:none; }
  .head-settings { border-color:color-mix(in srgb,var(--accent) 58%,var(--border)); background:var(--bg); font-weight:600; }
  .service-status { display:inline-flex; align-items:center; gap:6px; min-width:0; color:var(--fg-dim); font-size:11.5px; white-space:nowrap; }
  .service-status .key-dot { margin:0; }
  main { flex:1; min-height:0; padding:14px 20px; overflow-y:auto; }
  .set-row { display:flex; align-items:center; gap:10px; padding:7px 0; }
  .set-row label { width:88px; flex:none; font-size:12.5px; font-weight:600; }
  .inp, .sel { border:1px solid var(--border); background:var(--bg); color:var(--fg); border-radius:6px; padding:4px 8px; font-size:12px; font-family:var(--font-ui); }
  .inp:focus, .sel:focus { border-color:var(--accent); outline:none; }
  .inp { width:64%; }
  textarea.inp { width:100%; resize:vertical; line-height:1.6; }
  .btn { border:1px solid var(--border); background:var(--bg); color:var(--fg); border-radius:6px; padding:6px 8px; font-size:12px; cursor:pointer; font-family:var(--font-ui); display:inline-flex; align-items:center; gap:5px; }
  .btn:hover { border-color:var(--accent); color:var(--accent); }
  .btn.pri { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); }
  .hint { font-size:12px; color:var(--fg-dim); margin-top:8px; }
  .sec { font-size:12.5px; margin:10px 0 4px; }
  .acts { display:flex; gap:8px; justify-content:flex-end; margin-top:12px; }
  .sr-only { position:absolute!important; width:1px!important; height:1px!important; padding:0!important; margin:-1px!important; overflow:hidden!important; clip:rect(0,0,0,0)!important; white-space:nowrap!important; border:0!important; }
  .project-head { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:12px; }
  .project-head h2 { margin:0; font-size:17px; }
  .project-head p { margin:3px 0 0; color:var(--fg-dim); font-size:12px; }
  .project-grid { display:grid; grid-template-columns:minmax(0,1fr) minmax(300px,.76fr); grid-template-areas:"material plan" "dump plan"; gap:12px 18px; align-items:start; }
  .project-material { grid-area:material; }
  .project-dump { grid-area:dump; }
  .project-plan { grid-area:plan; position:sticky; top:0; min-width:0; }
  .project-card { border:1px solid var(--border); border-radius:10px; padding:12px; background:var(--bg-elev); }
  .project-title { font-size:12.5px; font-weight:700; margin-bottom:8px; }
  .project-field { margin-bottom:9px; }
  .project-field label { display:block; font-size:11.5px; color:var(--fg-dim); margin-bottom:3px; }
  .project-field input, .project-field textarea, .project-field select { width:100%; border:1px solid var(--border); background:var(--bg); color:var(--fg); border-radius:7px; padding:6px 8px; font:12.5px var(--font-ui); }
  .project-field-row { display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:end; gap:8px; }
  .project-field-row .project-field { margin-bottom:0; }
  .project-field-row .btn { min-height:32px; margin-bottom:1px; }
  .length-fieldset { min-width:0; margin:0; padding:0; border:0; }
  .length-fieldset > legend { width:100%; padding:0; }
  .length-cards { display:grid; grid-template-columns:repeat(4,1fr); gap:7px; }
  .length-card { min-width:0; min-height:56px; border:1px solid var(--border); border-radius:9px; background:var(--bg); color:var(--fg); padding:8px 7px; cursor:pointer; text-align:left; font-family:var(--font-ui); }
  .length-card b, .length-card span { display:block; }
  .length-card span { color:var(--fg-dim); font-size:10.5px; margin-top:2px; }
  .length-card.on { border-color:var(--accent); background:var(--accent-soft); color:var(--accent); }
  .length-card:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .length-card:disabled { opacity:.58; cursor:not-allowed; }
  .length-custom { min-height:18px; margin-top:5px; color:var(--fg-dim); font-size:11px; }
  .length-custom.on { color:var(--accent); font-weight:600; }
  .smart-row { display:grid; grid-template-columns:1fr auto 1fr auto 1fr; align-items:end; gap:7px; margin-top:10px; color:var(--fg-dim); }
  .smart-row label, .smart-label { display:block; font-size:11px; }
  .smart-row input { width:100%; display:block; margin-top:3px; }
  .smart-output { min-height:31px; display:flex; align-items:center; margin-top:3px; border:1px solid var(--border); border-radius:7px; padding:6px 8px; background:var(--bg); color:var(--fg); font:12.5px var(--font-ui); }
  .word-chips { display:flex; flex-wrap:wrap; gap:5px; margin-top:7px; }
  .word-chips button, .choice-chip { border:1px solid var(--border); border-radius:999px; padding:3px 9px; background:var(--bg); color:var(--fg-dim); font:11px var(--font-ui); cursor:pointer; }
  .word-chips button.on, .choice-chip.on { border-color:var(--accent); color:var(--accent); background:var(--accent-soft); }
  .lbl { display:block; color:var(--fg-dim); font-size:11.5px; }
  .ta { width:100%; margin-top:4px; resize:vertical; border:1px solid var(--border); background:var(--bg); color:var(--fg); border-radius:7px; padding:6px 8px; font:12.5px/1.5 var(--font-ui); }
  .ta:focus { border-color:var(--accent); outline:none; }
  .advanced { margin-top:10px; border:1px solid var(--border); border-radius:9px; }
  .advanced > summary { padding:8px 10px; cursor:pointer; font-weight:600; }
  .advanced-body { padding:4px 10px 10px; border-top:1px solid var(--border); }
  .inline-row { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin:8px 0; font-size:12px; }
  .chip-row { display:flex; flex-wrap:wrap; gap:5px; margin:5px 0 9px; }
  .research-list { display:grid; gap:5px; margin:6px 0 9px; max-height:150px; overflow:auto; }
  .research-source { display:flex; align-items:flex-start; gap:7px; padding:6px 7px; border:1px solid var(--border); border-radius:7px; background:var(--bg); font-size:11.5px; }
  .research-source span { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .feed-summary { display:flex; justify-content:space-between; gap:8px; margin:7px 0; padding:7px 8px; border:1px solid var(--border); border-radius:7px; background:var(--bg); color:var(--fg-dim); font-size:11.5px; }
  .feed-list { display:grid; gap:5px; margin:6px 0; max-height:170px; overflow:auto; }
  .feed-cluster { padding:7px 8px; border-left:2px solid var(--border); background:var(--bg); }
  .feed-cluster.hot { border-left-color:var(--accent); }
  .feed-cluster-head { display:flex; justify-content:space-between; align-items:baseline; gap:8px; font-size:11.5px; }
  .feed-cluster-head b { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .feed-cluster-head span { flex:none; color:var(--accent); font-variant-numeric:tabular-nums; }
  .feed-actions { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:7px; }
  .project-actions { position:sticky; bottom:-14px; z-index:4; display:flex; gap:8px; margin:12px -12px 0; padding:10px 12px; border-top:1px solid var(--border); background:color-mix(in srgb,var(--bg-elev) 94%,transparent); box-shadow:0 -8px 18px rgba(0,0,0,.10); backdrop-filter:blur(8px); }
  .project-actions .btn { flex:1; justify-content:center; }
  .project-status { min-height:20px; margin-top:7px; color:var(--fg-dim); font-size:11.5px; }
  .project-status.err { color:var(--danger); }
  .project-status.ok { color:var(--ok); }
  #pj-form[aria-busy="true"] .project-card { cursor:progress; }
  .provider-layout { display:grid; grid-template-columns:minmax(300px,.9fr) minmax(360px,1.1fr); gap:14px; align-items:start; }
  .provider-card { border:1px solid var(--border); border-radius:10px; padding:12px; background:var(--bg-elev); }
  .provider-card h2 { margin:0 0 4px; font-size:15px; }
  .provider-card h3 { margin:14px 0 5px; font-size:12.5px; }
  .key-dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; background:var(--fg-dim); }
  .key-dot.on { background:var(--ok); box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 15%,transparent); }
  .required-mark { color:var(--danger); }
  .hint.err { color:var(--fg); background:color-mix(in srgb,var(--danger) 10%,var(--bg)); box-shadow:inset 3px 0 0 var(--danger); text-indent:8px; }
  .provider-chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .provider-chip { border:1px solid var(--border); border-radius:999px; padding:3px 8px; color:var(--fg-dim); font-size:11px; }
  .route-list { margin-top:8px; border-top:1px solid var(--border); }
  .route-row { display:grid; grid-template-columns:112px minmax(0,1fr); align-items:center; gap:8px; padding:7px 0; border-bottom:1px solid var(--border); }
  .route-name { font-size:12px; }
  .route-name small { display:block; color:var(--fg-dim); font-size:10px; }
  .route-pick { width:100%; justify-content:flex-start; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  @media (max-width:760px) {
    .head { padding-left:10px; }
    .head-subtitle { display:none; }
    main { padding:10px 14px; }
    .project-head { margin-bottom:8px; }
    .project-head p { display:none; }
    .project-grid { grid-template-columns:minmax(0,1fr); grid-template-areas:"plan" "material" "dump"; gap:10px; }
    .project-plan { position:static; }
    .project-actions { bottom:-10px; margin-left:-12px; margin-right:-12px; }
    .provider-layout { grid-template-columns:1fr; }
  }
  @media (max-width:520px) {
    .head { min-height:44px; gap:7px; padding-right:98px; }
    .head-title { font-size:13.5px; }
    .service-status { display:none; }
    .head-settings { padding-inline:8px; }
    .project-head { display:none; }
    .length-cards { gap:5px; }
    .project-plan { padding:10px; }
    .length-card { min-height:48px; padding:5px; text-align:center; }
    .length-custom { min-height:14px; margin-top:2px; }
    .smart-row { grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr); gap:6px; margin-top:6px; }
    .smart-row > .equation { display:none; }
    .smart-row label { min-width:0; }
    .project-plan > .hint { margin-top:4px; }
    .word-chips { flex-wrap:nowrap; overflow-x:auto; margin-top:4px; padding-bottom:2px; }
    .word-chips button { flex:none; }
    .project-actions { bottom:0; gap:5px; margin-top:7px; padding-block:8px; }
    .project-actions .btn { min-width:0; padding-inline:5px; }
  }
</style></head><body><script type="module" src="panel-runtime.js"></script>
<div class="pwin">
  <div class="p-drag"></div>
  <div class="p-winbtns"><button id="p-min" title="最小化"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg></button><button id="p-max" title="最大化/还原"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="1.5"/></svg></button><button class="x" id="p-close" title="关闭"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <header class="head" id="panel-head"></header>
  <main id="m" class="ps-scroll-y"></main>
</div>
<script>
const $ = (s) => document.querySelector(s);
const ROUTE_ICON = '<svg class="mz-ico" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z"/></svg>';
const pwb = (a) => window.mazz.invoke('window:' + a).catch(() => {});
$('#p-min').addEventListener('click', () => pwb('minimize'));
$('#p-max').addEventListener('click', () => pwb('toggleMaximize'));
$('#p-close').addEventListener('click', () => pwb('close'));
const applyTheme = (id, vars) => { if (id) document.documentElement.dataset.theme = id; if (vars) for (const [k, v] of Object.entries(vars)) if (v) document.documentElement.style.setProperty('--' + k, v); };
window.mazz.invoke('panel:action', { type: 'themeSnapshot' }).catch(() => {});
window.mazz.on('theme:changed', ({ id, vars }) => applyTheme(id, vars));
window.mazz.on('panel:push', (p) => { if (p?.type === 'themeInit') applyTheme(p.id, p.vars); });
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const attr = (s) => esc(s).replace(/"/g, '&quot;');

let tab = 'provider', PRESETS = [], providerState = null, projectSnapshot = null;
let projectValues = {}, projectBatch = '', projectDump = '', projectSubmitTxn = null;

function providerStatusInfo() {
  const count = providerState?.connected?.length || 0;
  const hint = String(projectSnapshot?.providerHint || '');
  const ready = count > 0 || (!!hint && /已|就绪|可用/.test(hint) && !/未|无|失败/.test(hint));
  return { ready, text: ready ? (count ? `${count} 个 AI 连接可用` : 'AI 服务已就绪') : 'AI 服务待配置' };
}

function renderHead() {
  const head = $('#panel-head');
  const status = providerStatusInfo();
  if (tab === 'project') {
    head.innerHTML = `
      <div class="head-primary"><h1 class="head-title">新项目立项</h1><span class="head-subtitle">先定材料与篇幅，再进入智能创作执行台</span></div>
      <div class="head-actions"><span class="service-status" role="status"><i class="key-dot ${status.ready ? 'on' : ''}"></i>${esc(status.text)}</span><button type="button" class="btn head-settings" id="head-provider" data-t="provider" ${projectSubmitTxn ? 'disabled' : ''}>AI 服务设置</button></div>`;
  } else {
    const title = tab === 'provider' ? 'AI 服务设置' : '新建创作模板';
    head.innerHTML = `
      <div class="head-primary"><button type="button" class="btn head-back" data-t="project" aria-label="返回新项目立项">← 返回立项</button><h1 class="head-title">${title}</h1></div>
      ${tab === 'provider' ? `<span class="service-status" role="status"><i class="key-dot ${status.ready ? 'on' : ''}"></i>${esc(status.text)}</span>` : ''}`;
  }
  head.querySelectorAll('[data-t]').forEach(button => button.addEventListener('click', () => setTab(button.dataset.t)));
}

function setTab(next) {
  if (!['project', 'provider', 'genre'].includes(next)) return;
  tab = next;
  document.title = next === 'project' ? '新项目立项' : next === 'provider' ? 'AI 服务设置' : '新建创作模板';
  renderHead();
  render();
  if (next === 'project') window.mazz.invoke('panel:action', { type: 'factoryProjectQuery' }).catch(error => showProjectStatus('读取立项草稿失败：' + (error?.message || error), 'err'));
}

window.mazz.on('panel:push', (p) => {
  if (p?.type === 'factoryPresets') { PRESETS = p.presets || []; if (tab === 'provider') renderProvider(); return; }
  if (p?.type === 'factoryProviderState') { providerState = p.state || null; renderHead(); if (tab === 'provider') renderProvider(); return; }
  if (p?.type === 'factoryProviderError') {
    if (tab === 'provider') { const el = $('#pv-status'); if (el) { el.textContent = '✗ ' + (p.message || '操作失败'); el.classList.add('err'); } }
    else if (tab === 'project') showProjectStatus('AI 服务设置失败：' + (p.message || '操作失败'), 'err');
    return;
  }
  if (p?.type === 'factoryActionResult') { finishProjectSubmit(p); return; }
  if (p?.type === 'factoryInit' && p.tab) setTab(p.tab);
  if (p?.type === 'factoryProjectSnapshot') {
    const previous = projectSnapshot;
    const next = p.snapshot || null;
    const lengthOnly = tab === 'project' && isLengthOnlySnapshot(previous, next);
    projectSnapshot = next;
    projectValues = { ...(projectSnapshot?.values || {}) };
    projectDump = String(projectSnapshot?.dump ?? projectDump);
    renderHead();
    if (tab === 'project') lengthOnly ? updateProjectLengthState(projectSnapshot) : renderProject();
  }
});
// PRESETS 桥取（单源在 provider.js，面板不复制）
window.mazz.invoke('panel:action', { type: 'factoryPresetsQuery' }).catch(() => {});
window.mazz.invoke('panel:action', { type: 'factoryProviderQuery' }).catch(() => {});
window.mazz.invoke('panel:action', { type: 'factoryInitQuery' }).catch(() => {});
window.mazz.invoke('panel:action', { type: 'factoryProjectQuery' }).catch(() => {});

function render() { tab === 'project' ? renderProject() : tab === 'provider' ? renderProvider() : renderGenre(); }

// ==================== W60b 一次性项目立项 ====================
const projectAct = (act, extra = {}) => window.mazz.invoke('panel:action', { type: 'factoryAction', act, ...extra }).catch(error => {
  showProjectStatus('操作失败：' + (error?.message || error), 'err');
  return null;
});
function projectFieldHtml(f, index) {
  const id = `pj-field-${index}`;
  const required = f.required ? '<b class="required-mark"> *</b>' : '';
  const requiredAttrs = f.required ? 'required aria-required="true"' : '';
  const value = projectValues[f.id] ?? f.default ?? '';
  if (f.type === 'textarea') return `<div class="project-field"><label for="${id}">${esc(f.label)}${required}</label><textarea id="${id}" data-p-field="${attr(f.id)}" rows="3" placeholder="${attr(f.placeholder || '')}" ${requiredAttrs}>${esc(value)}</textarea></div>`;
  if (f.type === 'select') return `<div class="project-field"><label for="${id}">${esc(f.label)}${required}</label><select id="${id}" data-p-field="${attr(f.id)}" ${requiredAttrs}>${(f.options || []).map(o => `<option value="${attr(o)}" ${o === value ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select></div>`;
  return `<div class="project-field"><label for="${id}">${esc(f.label)}${required}</label><input id="${id}" data-p-field="${attr(f.id)}" value="${attr(value)}" placeholder="${attr(f.placeholder || '')}" spellcheck="false" ${requiredAttrs}></div>`;
}

function snapshotWithoutLength(snapshot) {
  if (!snapshot) return '';
  const copy = { ...snapshot };
  delete copy.lengthPlan;
  return JSON.stringify(copy);
}

function isLengthOnlySnapshot(previous, next) {
  return !!previous && !!next && previous.genreId === next.genreId && snapshotWithoutLength(previous) === snapshotWithoutLength(next);
}

function matchingPreset(plan, presets) {
  return (presets || []).find(p => p.id === plan.preset
    && Number(p.totalWords || 0) === Number(plan.totalWords || 0)
    && Number(p.wordsPerUnit || 0) === Number(plan.wordsPerUnit || 0)) || null;
}

function formatPresetTotal(preset) {
  if (preset.id === 'unlimited' || !Number(preset.totalWords)) return '不限';
  const total = Number(preset.totalWords);
  return total % 10000 === 0 ? `${total / 10000}万字` : `${total.toLocaleString('zh-CN')}字`;
}

function chapterText(plan, unitName) {
  return Number(plan.totalWords) > 0 ? `${Math.ceil(Number(plan.totalWords) / Math.max(1, Number(plan.wordsPerUnit) || 1))}${unitName}` : '不限';
}

function captureProjectView() {
  const m = $('#m');
  const active = document.activeElement;
  return {
    scrollTop: m?.scrollTop || 0,
    advancedOpen: m?.querySelector('details.advanced')?.open === true,
    activeId: active?.id || '',
    activeField: active?.dataset?.pField || '',
    selectionStart: typeof active?.selectionStart === 'number' ? active.selectionStart : null,
    selectionEnd: typeof active?.selectionEnd === 'number' ? active.selectionEnd : null,
  };
}

function restoreProjectView(view) {
  const m = $('#m');
  if (!m || !view) return;
  m.scrollTop = view.scrollTop;
  const active = view.activeId ? document.getElementById(view.activeId)
    : [...m.querySelectorAll('[data-p-field]')].find(el => el.dataset.pField === view.activeField);
  if (!active || active.disabled) return;
  active.focus({ preventScroll: true });
  if (view.selectionStart !== null && typeof active.setSelectionRange === 'function') {
    active.setSelectionRange(view.selectionStart, view.selectionEnd ?? view.selectionStart);
  }
  m.scrollTop = view.scrollTop;
}

function showProjectStatus(message = '', tone = '') {
  projectNotice = { message: String(message || ''), tone };
  const el = $('#pj-status');
  if (!el) return;
  el.textContent = projectNotice.message;
  el.className = `project-status ${projectNotice.tone || ''}`.trim();
}

let projectNotice = { message: '', tone: '' };
function setProjectBusy(busy, message = '') {
  const form = $('#pj-form');
  if (form) form.setAttribute('aria-busy', busy ? 'true' : 'false');
  ['pj-copy', 'pj-add', 'pj-generate'].forEach(id => { const button = document.getElementById(id); if (button) button.disabled = busy; });
  if (message) showProjectStatus(message);
  renderHead();
}

function finishProjectSubmit(result) {
  if (!projectSubmitTxn || result?.requestId !== projectSubmitTxn.requestId) return;
  clearTimeout(projectSubmitTxn.timer);
  if (!result.ok) {
    const receiptTasks = result?.receipt?.batch && Array.isArray(result.receipt.tasks)
      ? result.receipt.tasks
      : (result?.receipt?.taskId ? [result.receipt] : []);
    const registered = receiptTasks.filter(item => item?.taskId);
    const accepted = registered.filter(item => item?.accepted);
    if (registered.length) {
      // Some rows already own durable folders/receipts.  Releasing this UUID
      // would let a second submit duplicate those accepted rows.  Keep the
      // transaction in a retryable in-doubt state: the next click replays the
      // same requestId and the registry fills only the missing receipts.
      projectSubmitTxn.timer = null;
      projectSubmitTxn.retryable = true;
      setProjectBusy(false);
      const prefix = result.message ? `${result.message}；` : '';
      const progress = accepted.length
        ? `已有 ${accepted.length}/${registered.length} 个项目建立持久收据`
        : `${registered.length} 个项目已登记，持久收据尚未写完`;
      showProjectStatus(`${prefix}${progress}；点击重试将沿用同一请求，只补齐未完成项目。`, 'err');
      return;
    }
    projectSubmitTxn = null;
    setProjectBusy(false);
    showProjectStatus(result.message || '立项未完成，请检查后重试。', 'err');
    return;
  }
  projectSubmitTxn = null;
  const receipt = result.receipt?.id || result.receipt?.taskId || (typeof result.receipt === 'string' ? result.receipt : '');
  setProjectBusy(false);
  showProjectStatus(result.message || (receipt ? `立项完成 · ${receipt}` : '立项完成'), 'ok');
  pwb('close');
}

function noteProjectSubmitDelay(requestId) {
  if (!projectSubmitTxn || requestId !== projectSubmitTxn.requestId) return;
  projectSubmitTxn.timer = null;
  showProjectStatus('仍在等待主窗口确认或建立持久收据；为避免重复立项，本次请求保持锁定。', 'wait');
}

function makeRequestId() {
  return globalThis.crypto?.randomUUID?.() || `factory-${Date.now()}-${Math.random().toString(36).slice(2)}`;
}

function submitProject(mode) {
  const m = $('#m');
  const form = $('#pj-form');
  const plan = projectSnapshot?.lengthPlan || { preset: 'short', totalWords: 10000, wordsPerUnit: 2000 };
  const retryTxn = projectSubmitTxn?.retryable ? projectSubmitTxn : null;
  if (!form || (projectSubmitTxn && !retryTxn)) return;
  const submitMode = retryTxn?.mode || mode;
  if (!form.reportValidity()) {
    showProjectStatus('请补齐必填项，并检查字数范围。', 'err');
    return;
  }
  const values = { ...projectValues };
  m.querySelectorAll('[data-p-field]').forEach(el => { values[el.dataset.pField] = el.value; });
  const total = $('#pj-total').disabled ? 0 : Math.max(1, +$('#pj-total').value || plan.totalWords || 1);
  const words = Math.max(100, +$('#pj-words').value || plan.wordsPerUnit || 100);
  const draft = {
    values, dump: $('#pj-dump').value,
    preset: plan.preset,
    totalWords: total,
    wordsPerUnit: words,
    dualLoop: $('#pj-dual').checked, maxMode: $('#pj-max').checked,
    reviewRitual: $('#pj-review-ritual').value,
    reviewBudgetCap: Math.max(0, +$('#pj-review-budget').value || 32000),
    autoPreview: $('#pj-autopreview').checked,
    concurrency: +$('#pj-concurrency').value || 1,
    exportFmt: $('#pj-format').value,
    batchTitles: projectBatch.split(/\r?\n/).map(x => x.trim()).filter(Boolean),
  };
  const requestId = retryTxn?.requestId || makeRequestId();
  projectSubmitTxn = { requestId, mode: submitMode, retryable: false, timer: null };
  // 批量“立刻开工”可能停在主窗的人工作品数确认上。超时只能提示等待，
  // 不能释放 requestId 后让用户以新 UUID 重试，否则迟到收据会造成整批重复。
  projectSubmitTxn.timer = setTimeout(() => noteProjectSubmitDelay(requestId), 45000);
  setProjectBusy(true, submitMode === 'generate' ? '正在提交并启动项目…' : '正在加入队列…');
  window.mazz.invoke('panel:action', {
    type: 'factoryAction', act: 'projectSubmit', requestId,
    genreId: $('#pj-genre').value || projectSnapshot?.genreId || '', mode: submitMode, draft,
  }).catch(error => finishProjectSubmit({ requestId, ok: false, message: '立项提交失败：' + (error?.message || error) }));
}

function updateLengthPreview(clearPreset = true) {
  const s = projectSnapshot;
  const total = $('#pj-total')?.disabled ? 0 : Math.max(0, +$('#pj-total')?.value || 0);
  const words = Math.max(1, +$('#pj-words')?.value || 1);
  const output = $('#pj-chapters');
  if (output) output.textContent = total > 0 ? `${Math.ceil(total / words)}${s?.unitName || '章'}` : '不限';
  if (clearPreset) {
    document.querySelectorAll('[data-preset]').forEach(button => { button.classList.remove('on'); button.setAttribute('aria-pressed', 'false'); });
    $('#pj-length-custom')?.classList.add('on');

  }
  document.querySelectorAll('[data-words]').forEach(button => button.classList.toggle('on', +button.dataset.words === words));

function updateProjectLengthState(snapshot) {
  if (!$('#pj-form')) { renderProject(); return; }
  const plan = snapshot.lengthPlan || { preset: 'short', totalWords: 10000, wordsPerUnit: 2000, maxChapters: 5 };
  const presets = snapshot.lengthPresets || [];
  const activePreset = matchingPreset(plan, presets);
  const total = $('#pj-total');
  const words = $('#pj-words');
  const unlimited = plan.preset === 'unlimited' && Number(plan.totalWords) === 0;
  if (total && document.activeElement !== total) total.value = unlimited ? '' : String(plan.totalWords || '');
  if (total) total.disabled = unlimited;
  if (words && document.activeElement !== words) words.value = String(plan.wordsPerUnit || '');
  document.querySelectorAll('[data-preset]').forEach(button => {
    const on = button.dataset.preset === activePreset?.id;
    button.classList.toggle('on', on);
    button.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  const custom = $('#pj-length-custom');
  if (custom) { custom.classList.toggle('on', !activePreset); custom.textContent = activePreset ? '选择预设后仍可微调' : '自定义篇幅'; }
  const output = $('#pj-chapters');
  if (output) output.textContent = chapterText(plan, snapshot.unitName || '章');
  document.querySelectorAll('[data-words]').forEach(button => button.classList.toggle('on', +button.dataset.words === Number(plan.wordsPerUnit)));
}

  m.querySelectorAll('[data-pa]').forEach(el => el.addEventListener('click', () => {
    const act = el.dataset.pa;

    else if (act === 'researchToggle') projectAct(act, { id: el.dataset.id, on: el.checked });
    else if (act === 'researchApprove') projectAct(act);
    else if (act === 'embeddel') projectAct(act, { i: el.dataset.i });
    else if (act === 'websearch') projectAct(act, { q: $('#pj-search').value.trim() });
    else if (act === 'feedScan') {
      const button = el; button.disabled = true; button.textContent = '扫描中…';
      projectAct(act, { q: $('#pj-feed-query').value.trim(), dimension: $('#pj-feed-dimension').value.trim() });
    } else if (act === 'feedApprove' || act === 'feedReject') projectAct(act);
    else projectAct(act);
  }));

        <h2>中央登记</h2><div class="hint">每个服务商独立保存 Key；留空不会覆盖已经加密保存的 Key。</div>
        <div class="set-row"><label>服务商</label>
          <select id="pv-preset" class="sel">${PRESETS.map(p => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}</select></div>
        <div class="set-row"><label>接口地址</label><input id="pv-base" class="inp" value="${esc(cfg.baseURL || '')}" placeholder="https://api.deepseek.com" spellcheck="false"></div>
        <div class="set-row"><label>模型</label>
          <input id="pv-model" class="inp" style="width:44%" value="${esc(def.model || cfg.model || '')}" placeholder="模型名（可直接编辑）" spellcheck="false">
          <select id="pv-model-sel" class="sel" style="max-width:30%"><option value="">选单…</option></select>
          <button class="btn" id="pv-fetch" title="从端点拉取全部模型">拉取</button></div>
        <div class="set-row"><label>API Key</label><input id="pv-key" class="inp" type="password" value="" placeholder="${cfg.keySet ? '● 已加密保存；留空不改' : 'sk-…（加密存储）'}" spellcheck="false"></div>
        <div class="acts"><button class="btn" id="pv-test">测试新输入</button><button class="btn pri" id="pv-save">保存并设为全局</button></div>
        <div id="pv-status" class="hint"><span class="key-dot ${cfg.keySet ? 'on' : ''}"></span>${cfg.keySet ? '当前服务商已有 Key' : '当前服务商尚无 Key'}；密钥值不会回传到本窗口。</div>
        <h3>密钥状态</h3>
        <div class="provider-chips">${providerState.providers.map(p => `<span class="provider-chip"><i class="key-dot ${p.keySet ? 'on' : ''}"></i>${esc(p.name)}</span>`).join('')}</div>
      </section>
      <section class="provider-card">
        <h2>AI 分工</h2><div class="hint">中央登记，就地指派。选单只出现已经保存 Key 的 服务商 × 模型；岗位留空时跟随全局。</div>
        <div class="route-list">${rows.map(r => {
          const current = connectedLabel(r.target) || (r.id === 'default' ? '尚未接入可用模型' : '跟随全局');
          return `<div class="route-row"><div class="route-name">${esc(r.label)}${r.card ? `<small>${esc(cardLabel(r.card))}</small>` : '<small>三级路由兜底</small>'}</div><button class="btn route-pick" data-ai-route="${attr(r.id)}" title="${attr(current)}">${ROUTE_ICON}<span>${esc(current)}</span></button></div>`;
        }).join('')}</div>
      </section>
    </div>
    <div class="hint">路由解析顺序：岗位改派（有 Key）→ 全局默认（有 Key）→ 人话报错并引导回本页。</div>`;
  const g = (id) => m.querySelector(id);
  g('#pv-preset').value = PRESETS.some(p => p.id === def.providerId) ? def.providerId : (PRESETS.find(p => p.baseURL === cfg.baseURL)?.id || 'custom');
  const fillModels = (ids) => { g('#pv-model-sel').innerHTML = '<option value="">选单…</option>' + (ids || []).map(id => `<option value="${esc(id)}">${esc(id)}</option>`).join(''); };
  fillModels(PRESETS.find(x => x.id === g('#pv-preset').value)?.models || []);
  g('#pv-preset').addEventListener('change', () => {
    const p = PRESETS.find(x => x.id === g('#pv-preset').value);
    const saved = providerState.providers.find(x => x.id === p?.id);
    g('#pv-base').value = saved?.baseURL || p?.baseURL || '';
    g('#pv-model').value = saved?.model || p?.model || p?.models?.[0] || '';
    g('#pv-key').value = '';
    g('#pv-key').placeholder = saved?.keySet ? '● 已加密保存；留空不改' : 'sk-…（加密存储）';
    fillModels(p?.models || []);
  });
  g('#pv-model-sel').addEventListener('change', () => { if (g('#pv-model-sel').value) g('#pv-model').value = g('#pv-model-sel').value; });
  g('#pv-fetch').addEventListener('click', async () => {
    g('#pv-status').textContent = '拉取模型中…';
    try {
      const ids = await window.mazz.invoke('factory:aiModels', { baseURL: g('#pv-base').value.trim(), apiKey: g('#pv-key').value });
      fillModels(ids || []);
      g('#pv-status').textContent = ids?.length ? `拉到 ${ids.length} 个模型` : '端点未返回模型清单';
    } catch (e) { g('#pv-status').textContent = '拉取失败：' + (e.message || e); }
  });
  g('#pv-test').addEventListener('click', async () => {
    g('#pv-status').textContent = '测试中…';
    try {
      await window.mazz.invoke('factory:aiChat', { baseURL: g('#pv-base').value.trim(), apiKey: g('#pv-key').value, model: g('#pv-model').value.trim(), system: '你是助手', user: '用四个字回答：连接正常', maxTokens: 32 });
      g('#pv-status').textContent = '✓ 连接正常';
    } catch (e) { g('#pv-status').textContent = '✗ ' + (e.message || e); }
  });
  g('#pv-save').addEventListener('click', async () => {
    const preset = PRESETS.find(x => x.id === g('#pv-preset').value) || {};
    if (!g('#pv-base').value.trim() || !g('#pv-model').value.trim()) { g('#pv-status').textContent = '✗ 接口地址和模型不能为空'; return; }
    g('#pv-status').textContent = '保存到加密分仓中…';
    window.mazz.invoke('panel:action', { type: 'factoryProviderSave', connection: {
      providerId: preset.id || 'custom', name: preset.name || '自定义端点', baseURL: g('#pv-base').value.trim(), model: g('#pv-model').value.trim(),
      models: [...new Set([...(preset.models || []), g('#pv-model').value.trim()])], cards: preset.cards || [], apiKey: g('#pv-key').value.trim() || undefined, makeDefault: true,
    } }).catch(e => { g('#pv-status').textContent = '✗ ' + e.message; });
  });
  m.querySelectorAll('[data-ai-route]').forEach(b => b.addEventListener('click', () => {
    const rect = b.getBoundingClientRect();
    const anchor = {
      screenX: window.screenX + rect.left,
      screenY: window.screenY + rect.bottom,
      width: rect.width,
      height: rect.height,
      devicePixelRatio: window.devicePixelRatio || 1,
    };
    window.mazz.invoke('panel:action', { type: 'factoryRolePickOpen', role: b.dataset.aiRoute, anchor }).catch(error => {
      const status = $('#pv-status');
      if (status) { status.textContent = '✗ 打开岗位选择失败：' + (error?.message || error); status.classList.add('err'); }
    });
  }));
  // W57 旧契约检索哨兵：secret:get / secret:set 已迁到 provider.js 的 factory.keys 加密分仓，配置窗不再直读密钥。
}

// ==================== 新建创作模板 ====================
function renderGenre() {
  const m = $('#m');
  m.innerHTML = `
    <section aria-labelledby="genre-editor-title"><h2 id="genre-editor-title" style="margin:0 0 6px;font-size:15px">新建创作模板</h2><p class="hint" style="margin:0 0 10px">保存后返回立项页，即可从文体选单使用。</p>
    <div class="set-row"><label for="ge-name">名称 <b class="required-mark">*</b></label><input id="ge-name" class="inp" placeholder="护理记录" required></div>
    <div class="set-row"><label for="ge-desc">描述</label><input id="ge-desc" class="inp" placeholder="简短说明"></div>
    <label class="sec" for="ge-fields">输入字段（每行一个：标签|类型|必填。类型：text/textarea/select）</label>
    <textarea id="ge-fields" rows="4" class="inp" spellcheck="false">患者姓名|text|必填
护理要点|textarea|必填
记录类型|text|选填</textarea>
    <label class="sec" for="ge-sys">系统提示词（角色与文风要求）</label>
    <textarea id="ge-sys" rows="3" class="inp" spellcheck="false">你是一名资深…</textarea>
    <label class="sec" for="ge-checks">质量校验（每行一条：描述|规则:值，如 不少于500字|minLength:500）</label>
    <textarea id="ge-checks" rows="3" class="inp" spellcheck="false">不少于 500 字|minLength:500
必须包含签名|contains:签名</textarea>
    <div class="acts"><button type="button" class="btn pri" id="ge-save">保存到工作区</button></div>
    <div id="ge-status" class="hint" role="status" aria-live="polite"></div></section>`;
  const g = (id) => m.querySelector(id);
  g('#ge-save').addEventListener('click', async () => {
    const name = g('#ge-name').value.trim();
    if (!name) { g('#ge-status').textContent = '先起个名字'; return; }
    const fields = g('#ge-fields').value.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
      const [label, type = 'text', req] = l.split('|').map(x => x.trim());
      return { id: 'f_' + label, label, type: ['text', 'textarea', 'select'].includes(type) ? type : 'text', required: /必/.test(req || '') };
    });
    const checks = g('#ge-checks').value.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
      const [label, rule] = l.split('|').map(x => x.trim());
      const [r, v] = (rule || '').split(':');
      return { label, rule: r || 'minLength', value: isNaN(+v) ? v : +v };
    });
    const tpl = {
      id: 'custom_' + name, name, description: g('#ge-desc').value.trim(),
      input_fields: fields.length ? fields : [{ id: 'f_需求', label: '需求', type: 'textarea', required: true }],
      system_prompt: g('#ge-sys').value.trim() || '你是一名资深写作专家。',
      meta_vars: {}, output_rules: { format: 'markdown', max_length: 3000 },
      quality_checks: checks,
    };
    window.mazz.invoke('panel:action', { type: 'genreSave', tpl }).catch(() => {});
    g('#ge-status').textContent = '已保存到工作区（智能创作面板刷新）';
  });
}
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (projectSubmitTxn) {
    e.preventDefault();
    showProjectStatus('立项确认尚未结束；为避免重复项目，收到持久收据前不能关闭本窗口。', 'wait');
    return;
  }
  pwb('close');
});
window.addEventListener('beforeunload', event => {
  if (projectSubmitTxn) {
    event.preventDefault();
    event.returnValue = '';
    showProjectStatus('立项确认尚未结束；为避免重复项目，收到持久收据前不能关闭本窗口。', 'wait');
    return;
  }
  if (projectSubmitTxn?.timer) clearTimeout(projectSubmitTxn.timer);
});
renderHead();
renderProvider();
