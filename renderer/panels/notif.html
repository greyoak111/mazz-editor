<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'unsafe-inline'">
<title>通知中心</title>
<link rel="stylesheet" href="../styles/themes.css">
<link rel="stylesheet" href="panel-shared.css">
<style>
  html, body { height:100%;margin:0;background:transparent;overflow: hidden; }*{box-sizing:border-box}
  body{font:13px/1.5 var(--font-ui);color:var(--fg)}.pwin{height:100vh;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:0 10px 36px rgba(0,0,0,.4)}
  .drag{height:12px;flex:none;-webkit-app-region:drag}.winbtns{position:absolute;right:8px;top:2px;z-index:5}.winbtns button{width:30px;height:22px;border:0;border-radius:6px;background:transparent;color:var(--fg-dim);cursor:pointer}.winbtns button:hover{background:#e81123;color:#fff}
  header{display:flex;align-items:center;gap:8px;padding:8px 14px 11px;border-bottom:1px solid var(--border);background:var(--bg-elev)}header b{font-size:14px}header .count{color:var(--accent);font-size:12px}.spacer{flex:1}
  button.action{border:1px solid var(--border);background:var(--bg);color:var(--fg-dim);border-radius:6px;padding:4px 8px;cursor:pointer;font:12px var(--font-ui)}button.action:hover{border-color:var(--accent);color:var(--accent)}
  .tabs{display:flex;gap:4px;padding:8px 12px 0}.tab{border:0;background:transparent;color:var(--fg-dim);padding:5px 10px;border-radius:6px;cursor:pointer}.tab.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
  main{flex:1;min-height:0;overflow-y:auto;padding:10px 12px 16px}.empty{display:grid;place-items:center;height:100%;color:var(--fg-dim);text-align:center;line-height:2}
  .item{position:relative;border:1px solid var(--border);border-radius:9px;padding:10px 11px 9px 15px;margin-bottom:8px;background:var(--bg);cursor:pointer}.item:hover{border-color:var(--accent);background:var(--bg-hover)}.item.unread:before{content:'';position:absolute;left:5px;top:15px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
  .line{display:flex;align-items:center;gap:7px}.src{font:700 10px/1 var(--font-ui);letter-spacing:.4px;padding:4px 5px;border-radius:5px;background:var(--accent-soft);color:var(--accent)}.title{font-weight:650;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time{margin-left:auto;color:var(--fg-dim);font-size:11px;white-space:nowrap}.detail{margin-top:5px;color:var(--fg-dim);font-size:12px;white-space:pre-wrap;word-break:break-word}.item.failed{border-color:color-mix(in srgb,#dc2626 35%,var(--border))}.item.failed .src{background:color-mix(in srgb,#dc2626 12%,transparent);color:#dc2626}
</style></head><body>
<div class="pwin"><div class="drag"></div><div class="winbtns"><button id="close" title="关闭"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <header><b title="被动入账，可回看可跳转">通知中心</b><span class="count"></span><span class="spacer"></span><button class="action" id="read">全部已读</button><button class="action" id="clear">清理已读</button></header>
  <div class="tabs"><button class="tab on" data-filter="all">全部</button><button class="tab" data-filter="unread">未读</button></div>
  <main class="ps-scroll-y"></main>
</div>
<script>
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const labels={sync:'同步',archive:'归档',factory:'AI',download:'入库',transcode:'转码',system:'系统'};
let snapshot={unread:0,items:[]},filter='all';
function ago(ts){const d=Math.max(0,Date.now()-Number(ts||0));if(d<60000)return '刚刚';if(d<3600000)return Math.floor(d/60000)+' 分钟前';if(d<86400000)return Math.floor(d/3600000)+' 小时前';return new Date(ts).toLocaleDateString();}
function render(){
  document.querySelector('.count').textContent=snapshot.unread?`${snapshot.unread} 条未读`:'';
  const items=(snapshot.items||[]).filter(x=>filter==='all'||!x.read);
  const main=document.querySelector('main');
  main.innerHTML=items.length?items.map(x=>`<article class="item ${x.read?'':'unread'} ${x.status==='failed'?'failed':''}" data-id="${esc(x.id)}"><div class="line"><span class="src">${esc(labels[x.source]||x.source||'系统')}</span><span class="title">${esc(x.title)}</span><span class="time">${ago(x.updatedAt||x.at)}</span></div>${x.detail?`<div class="detail">${esc(x.detail)}</div>`:''}</article>`).join(''):'<div class="empty">暂无通知<br><small>转码、AI、同步、下载入库和解压结果会静默汇入这里</small></div>';
  main.querySelectorAll('.item').forEach(el=>el.addEventListener('click',()=>window.mazz.invoke('panel:action',{type:'notifOpen',id:el.dataset.id}).catch(()=>{})));
}
const applyTheme=(id,vars)=>{if(id)document.documentElement.dataset.theme=id;if(vars)for(const[k,v]of Object.entries(vars))if(v)document.documentElement.style.setProperty('--'+k,v)};
window.mazz.on('theme:changed',({id,vars})=>applyTheme(id,vars));
window.mazz.on('panel:push',p=>{if(p?.type==='themeInit')applyTheme(p.id,p.vars);if(p?.type==='notifSnapshot'){snapshot=p.data||snapshot;render();}});
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));render();}));
document.querySelector('#read').addEventListener('click',()=>window.mazz.invoke('panel:action',{type:'notifRead',id:'*'}).catch(()=>{}));
document.querySelector('#clear').addEventListener('click',()=>window.mazz.invoke('panel:action',{type:'notifClearRead'}).catch(()=>{}));
document.querySelector('#close').addEventListener('click',()=>window.mazz.invoke('window:close').catch(()=>{}));
document.addEventListener('keydown',e=>{if(e.key==='Escape')window.mazz.invoke('window:close').catch(()=>{});});
window.mazz.invoke('panel:action',{type:'themeSnapshot'}).catch(()=>{});
window.mazz.invoke('panel:action',{type:'notifQuery'}).catch(()=>{});
render();
</script></body></html>
