<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>收藏管理</title>
<link rel="stylesheet" href="../styles/themes.css">
<link rel="stylesheet" href="panel-shared.css"> <!-- 军规④：滚动条族消费方真实加载（base.css 面板窗不载——写了不算做了病绝育） -->
<style>
  html, body { background: transparent; margin: 0; height: 100%; overflow: hidden; } /* W58f：锁文档级滚动——滚动只发生在内层容器（外飘轨双滚动条实锤） */
  * { box-sizing: border-box; }
  body { margin:0; font:13px/1.6 var(--font-ui); }
  .pwin { display:flex; flex-direction:column; height:100vh; background:var(--bg); color:var(--fg); border-radius:12px; overflow:hidden; border:1px solid var(--border); box-shadow:0 10px 36px rgba(0,0,0,.4); }
  .p-drag { height:12px; flex:none; -webkit-app-region:drag; }
  .p-winbtns { position:absolute; top:2px; right:8px; display:flex; gap:2px; z-index:9; }
  .p-winbtns button { display:inline-flex; align-items:center; justify-content:center; -webkit-app-region:no-drag; width:30px; height:22px; border:0; border-radius:6px; background:transparent; color:var(--fg-dim); cursor:pointer; font-size:12px; }
  .p-winbtns button:hover { background:var(--bg-hover); color:var(--fg); }
  .p-winbtns button.x:hover { background:#e81123; color:#fff; }
  header { display:flex; align-items:center; gap:10px; padding:10px 16px; border-bottom:1px solid var(--border); background:var(--bg-elev); flex:none; }
  header b { font-size:15px; flex:1; }
  button { border:1px solid var(--border); background:var(--bg-elev); color:var(--fg); border-radius:7px; padding:4px 10px; cursor:pointer; font-size:12.5px; }
  button:hover { border-color:var(--accent); color:var(--accent); }
  button.pri { background:var(--accent); color:var(--accent-fg,#fff); border-color:var(--accent); }
  .newrow { display:flex; gap:8px; margin-bottom:12px; }
  .newrow input { flex:1; border:1px solid var(--border); background:var(--bg-elev); color:var(--fg); border-radius:7px; padding:6px 10px; font-size:13px; outline:none; }
  main { padding:12px 16px; overflow:auto; flex:1; }
  .folder { background:var(--bg-elev); border:1px solid var(--border); border-radius:10px; margin-bottom:10px; overflow:hidden; }
  .fhead { display:flex; align-items:center; gap:8px; padding:9px 12px; background:var(--accent-soft); }
  .fhead .name { flex:1; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:flex; align-items:center; gap:6px; }
  .fhead small { color:var(--fg-dim); font-weight:400; }
  .fi { width:14px; height:14px; flex:none; }
  .items { padding:6px 10px; }
  .item { display:flex; align-items:center; gap:8px; padding:6px 4px; border-top:1px solid var(--border); }
  .item:first-child { border-top:0; }
  .item .t { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer; }
  .item .t:hover { color:var(--accent); text-decoration:underline; }
  .item .u { color:var(--fg-dim); font-size:11px; max-width:38%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .empty { color:var(--fg-dim); padding:6px 4px; }
  .acts button { padding:1px 7px; font-size:11.5px; }
  select { border:1px solid var(--border); background:var(--bg-elev); color:var(--fg); border-radius:6px; padding:1px 4px; font-size:11.5px; }
</style></head><body>
<div class="pwin">
  <div class="p-drag"></div>
  <div class="p-winbtns"><button id="p-min" title="最小化"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg></button><button id="p-max" title="最大化/还原"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="1.5"/></svg></button><button class="x" id="p-close" title="关闭"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <header><b>收藏管理</b><span id="st" style="color:var(--fg-dim);font-size:12px"></span></header>
  <main class="mazz-scroll">
    <div class="newrow"><input id="nf" placeholder="新收藏夹名称（回车创建）"><button class="pri" id="nfbtn">新建收藏夹</button></div>
    <div id="list"></div>
  </main>
</div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const FOLDER_SVG = '<svg class="fi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 3h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>'; // 文件夹 emoji 消灭（风格一致化 stroke 族——用户定版）
// 窗控三键（窄条非全套标题栏）
const pwb=(a)=>window.mazz.invoke('window:'+a).catch(()=>{});
$('#p-min').addEventListener('click',()=>pwb('minimize'));
$('#p-max').addEventListener('click',()=>pwb('toggleMaximize'));
$('#p-close').addEventListener('click',()=>pwb('close'));
// 主题跟随主界面（初值+广播双通道——不再是 OS 明暗的一次性读取）
const applyTheme=(id,vars)=>{ if(id) document.documentElement.dataset.theme=id; if(vars) for(const [k,v] of Object.entries(vars)) if(v) document.documentElement.style.setProperty('--'+k,v); };
window.mazz.invoke('panel:action',{type:'themeSnapshot'}).catch(()=>{});
window.mazz.on('theme:changed',({id,vars})=>applyTheme(id,vars));
window.mazz.on('panel:push',(p)=>{ if(p?.type==='themeInit') applyTheme(p.id,p.vars); });
let bookmarks = [], folders = [];
async function load() {
  bookmarks = (await window.mazz.invoke('settings:get', { key: 'browser.bookmarks' }).catch(() => [])) || [];
  folders = (await window.mazz.invoke('settings:get', { key: 'browser.folders' }).catch(() => null)) || [{ id: 'default', name: '默认收藏夹' }];
  if (!folders.some(f => f.id === 'default')) folders.unshift({ id: 'default', name: '默认收藏夹' });
  render();
}
async function save(msg) {
  await window.mazz.invoke('settings:set', { key: 'browser.bookmarks', value: bookmarks }).catch(() => {});
  await window.mazz.invoke('settings:set', { key: 'browser.folders', value: folders }).catch(() => {});
  window.mazz.invoke('panel:changed', { kind: 'favmgr' }).catch(() => {}); // 回推主窗刷新（主页收藏区同步）
  $('#st').textContent = msg || '';
  setTimeout(() => { $('#st').textContent = ''; }, 2400);
  render();
}
function render() {
  $('#list').innerHTML = folders.map(f => {
    const items = bookmarks.filter(b => (b.folder || 'default') === f.id);
    return '<div class="folder"><div class="fhead" data-fid="' + f.id + '">'
      + '<span class="name">' + FOLDER_SVG + ' ' + esc(f.name) + ' <small>(' + items.length + ')</small></span>'
      + '<span class="acts"><button data-a="rnf">重命名</button>'
      + (f.id !== 'default' ? '<button data-a="dlf">删除夹</button>' : '')
      + '</span></div><div class="items">'
      + (items.length ? items.map(b => '<div class="item" data-url="' + esc(b.url) + '">'
        + '<span class="t" title="' + esc(b.url) + '">' + esc(b.name || b.title || b.url) + '</span>'
        + '<span class="u">' + esc(b.url) + '</span>'
        + '<span class="acts"><select data-a="mv">'
        + folders.map(x => '<option value="' + x.id + '"' + (x.id === (b.folder || 'default') ? ' selected' : '') + '>' + esc(x.name) + '</option>').join('')
        + '</select> <button data-a="rni">重命名</button> <button data-a="dli">删除</button></span></div>').join('')
        : '<div class="empty">（空）</div>')
      + '</div></div>';
  }).join('');
}
document.querySelector('#list').addEventListener('click', async (e) => {
  const a = e.target.dataset && e.target.dataset.a;
  const head = e.target.closest('.fhead');
  const item = e.target.closest('.item');
  if (e.target.classList.contains('t') && item) { window.mazz.invoke('panel:action', { type: 'openUrl', url: item.dataset.url }).catch(() => {}); return; }
  if (!a) return;
  if (head) {
    const f = folders.find(x => x.id === head.dataset.fid);
    if (a === 'rnf') { const v = prompt('收藏夹名称', f.name); if (v && v.trim()) { f.name = v.trim(); save('已重命名'); } }
    if (a === 'dlf') { if (!confirm('删除收藏夹「' + f.name + '」？条目归入默认')) return; bookmarks.forEach(b => { if ((b.folder || 'default') === f.id) b.folder = 'default'; }); folders = folders.filter(x => x.id !== f.id); save('已删除'); }
    return;
  }
  if (item) {
    const b = bookmarks.find(x => x.url === item.dataset.url);
    if (!b) return;
    if (a === 'rni') { const v = prompt('名称', b.name || b.title || ''); if (v != null) { b.name = v.trim(); save('已重命名'); } }
    if (a === 'dli') { bookmarks = bookmarks.filter(x => x !== b); save('已删除'); }
  }
});
document.querySelector('#list').addEventListener('change', (e) => {
  if (!e.target.dataset || e.target.dataset.a !== 'mv') return;
  const item = e.target.closest('.item');
  const b = bookmarks.find(x => x.url === (item && item.dataset.url));
  if (b) { b.folder = e.target.value; save('已移动'); }
});
const mk = () => { const v = $('#nf').value.trim(); if (!v) return; folders.push({ id: 'f' + Date.now().toString(36), name: v }); $('#nf').value = ''; save('已新建'); };
$('#nfbtn').addEventListener('click', mk);
$('#nf').addEventListener('keydown', (e) => { if (e.key === 'Enter') mk(); });
load();
</script></body></html>
